<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bébène</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: rgba(16,16,20,.62); --surface: rgba(44,44,52,.55); --raised: rgba(70,70,80,.5); --line: rgba(var(--ov),.09);
  --text: #ececef; --muted: #8d8d97; --accent: #d97757; --accent-2: #eb9a78;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: transparent; color: var(--text); overflow: hidden;
  font: 14px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; user-select: none; }
body { display: flex; flex-direction: row; }
#chat { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---- tableau de bord ---- */
body { background: rgba(14,14,18,.38); }            /* fenêtre en verre dépoli : le bureau se devine derrière */
.dh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.dh b { font-size: 15px; font-weight: 600; text-transform: capitalize; }
.dh .icon-btn { width: 28px; height: 28px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.cal .wd { font-size: 11px; color: var(--muted); padding-bottom: 4px; }
.cal .d { position: relative; height: 34px; border-radius: 9px; font-size: 12.5px; cursor: pointer; display: grid; place-items: center; color: var(--text); }
.cal .d:hover { background: var(--raised); }
.cal .d.out { color: #55555d; }
.cal .d.today { background: rgba(217,119,87,.16); color: var(--accent-2); font-weight: 600; }
.cal .d.sel { outline: 1.5px solid var(--accent); }
.cal .dots { position: absolute; bottom: 3px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
.cal .dots i { width: 4px; height: 4px; border-radius: 50%; }
.cal .d.exam::after { content: ""; position: absolute; top: 3px; right: 5px; width: 5px; height: 5px; border-radius: 50%; background: #e8504a; }
.day { margin: 8px 0 4px; display: flex; flex-direction: column; gap: 5px; }
.day .dt { font-size: 12px; color: var(--muted); text-transform: capitalize; }
.ev { display: flex; gap: 9px; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12.5px; }
.ev .bar { width: 3px; border-radius: 3px; flex: none; }
.ev .tt { font-weight: 500; overflow-wrap: anywhere; }
.ev .mt { color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
.none { color: var(--muted); font-size: 12px; padding: 4px 2px; }
.up { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.up .dte { width: 42px; flex: none; text-align: center; border-radius: 9px; background: var(--raised); padding: 4px 0; line-height: 1.15; }
.up .dte b { display: block; font-size: 16px; }
.up .dte span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; }
.up .inf { flex: 1; min-width: 0; font-size: 12.5px; }
.up .inf .tt { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up .inf .mt { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag { font-size: 10.5px; font-weight: 600; border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
.tag.exam { background: rgba(232,80,74,.16); color: #f08a85; }
.tag.rdv { background: rgba(95,168,211,.16); color: #8cc4e6; }
.soon { font-size: 11px; color: var(--accent-2); white-space: nowrap; flex: none; }
.cstat { font-size: 11px; color: var(--muted); margin-top: 8px; }
.cstat a { cursor: pointer; }
.empty-cal { font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 14px; text-align: center; }
.empty-cal button { margin-top: 8px; font: inherit; font-size: 12.5px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: #3a3a41; border-radius: 10px; border: 3px solid var(--bg); }

header { display: flex; align-items: center; gap: 11px; padding: 14px 12px 12px 16px; border-bottom: 1px solid var(--line); }
.orb { width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: #26262b; box-shadow: 0 0 0 3px rgba(217,119,87,.14); }
.orb svg { width: 82%; height: 82%; }
.orb.busy { animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(217,119,87,.22); } }
.title { flex: 1; min-width: 0; }
.title b { font-weight: 600; font-size: 14.5px; letter-spacing: .1px; }
.dir { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.dir:hover { color: var(--accent-2); }
.icon-btn { background: none; border: 0; color: var(--muted); width: 32px; height: 32px; border-radius: 9px; cursor: pointer; display: grid; place-items: center; }
.icon-btn:hover { background: var(--raised); color: var(--text); }

main { flex: 1; position: relative; min-height: 0; }
#log { position: absolute; inset: 0; overflow-y: auto; padding: 18px 16px 10px; display: flex; flex-direction: column; gap: 16px; user-select: text; }
.msg.user { align-self: flex-end; max-width: 85%; background: var(--raised); padding: 9px 14px; border-radius: 18px 18px 5px 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { overflow-wrap: anywhere; animation: rise .25s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
.msg.bot p { margin: .45em 0; } .msg.bot ul, .msg.bot ol { padding-left: 1.3em; margin: .4em 0; }
.msg.bot h1, .msg.bot h2, .msg.bot h3 { font-size: 15px; margin: .8em 0 .3em; }
.msg.bot table { border-collapse: collapse; margin: .5em 0; font-size: 13px; }
.msg.bot th, .msg.bot td { border: 1px solid var(--line); padding: 4px 8px; }
pre { background: #111114; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow-x: auto; margin: .5em 0; }
code { font: 12.5px "Cascadia Code", Consolas, monospace; background: var(--raised); padding: 1px 5px; border-radius: 5px; }
pre code { background: none; padding: 0; }
a { color: var(--accent-2); }
.tool { display: flex; align-items: center; gap: 7px; width: fit-content; max-width: 100%; font-size: 12px; color: var(--muted);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; margin: 5px 0; }
.tool span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; font-style: normal; }
.err { color: #f0a3a3; font-size: 13px; background: rgba(240,100,100,.08); border: 1px solid rgba(240,100,100,.25); border-radius: 10px; padding: 8px 12px; margin-top: 4px; white-space: pre-wrap; }
.typing { display: flex; gap: 5px; padding: 8px 0; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: dot 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 30% { transform: translateY(-5px); background: var(--accent); } }

#empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; }
#empty .orb { width: 64px; height: 64px; margin-bottom: 10px; }
#empty h2 { font-size: 19px; font-weight: 600; }
#empty p { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
.chips { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
.chip { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 12px; padding: 10px 14px; text-align: left; font: inherit; font-size: 13px; cursor: pointer; transition: border-color .15s, background .15s; }
.chip:hover { border-color: var(--accent); background: var(--raised); }

footer { padding: 10px 12px 12px; }
.box { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 14px; transition: border-color .15s; }
.box:focus-within { border-color: #5a4038; }
textarea { flex: 1; resize: none; border: 0; outline: 0; background: none; color: var(--text); font: inherit; max-height: 150px; padding: 5px 0; user-select: text; }
textarea::placeholder { color: #66666f; }
#send { width: 34px; height: 34px; border-radius: 11px; border: 0; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; flex: none; transition: opacity .15s, background .15s; }
#send:hover { background: var(--accent-2); }
#send:disabled { opacity: .3; cursor: default; background: var(--accent); }
#send.stop { background: var(--track); }
.opts { display: flex; justify-content: space-between; align-items: center; margin-top: 9px; padding: 0 4px; font-size: 12px; color: var(--muted); }
.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.switch input { display: none; }
.track { width: 28px; height: 16px; border-radius: 9px; background: var(--track); position: relative; transition: background .15s; }
.track::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(12px); }
kbd { font: 11px "Segoe UI", sans-serif; background: var(--raised); border-radius: 4px; padding: 1px 5px; }

.diff { margin: -2px 0 6px; font-size: 12px; }
.diff summary { color: var(--muted); cursor: pointer; width: fit-content; padding: 2px 4px; border-radius: 6px; }
.diff summary:hover { color: var(--accent-2); }
.diff pre { max-height: 260px; padding: 6px 0; }
.diff pre div { padding: 0 12px; white-space: pre-wrap; font: 12px "Cascadia Code", Consolas, monospace; }
.diff .del { background: rgba(240,90,90,.12); color: #f2aaaa; }
.diff .ins { background: rgba(80,200,120,.12); color: #9fe0b4; }
.diff .more { color: var(--muted); }

.approve { border: 1px solid #5a4038; background: rgba(217,119,87,.07); border-radius: 12px; padding: 10px 12px; font-size: 13px; animation: rise .25s ease; }
.approve .ah { font-weight: 600; }
.approve ul { margin: 8px 0 10px; padding-left: 1.1em; color: var(--muted); }
.approve li { margin: 3px 0; overflow-wrap: anywhere; }
.approve .ab { display: flex; justify-content: flex-end; gap: 8px; }
.ask { border: 1px solid #5a4038; background: rgba(217,119,87,.07); border-radius: 16px; padding: 10px 12px; font-size: 13px; animation: rise .25s ease; }
.ask .ah { font-weight: 600; display: flex; gap: 8px; align-items: flex-start; line-height: 1.4; }
.ask .ah span:first-child { color: var(--accent); font-size: 15px; line-height: 1.2; }
.ask .ch { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; }
.ask button { font: inherit; font-size: 13px; text-align: left; border-radius: 10px; padding: 7px 12px; cursor: pointer; border: 1px solid var(--line); background: var(--raised); color: var(--text); }
.ask button:hover { border-color: var(--accent); }
.ask button.o { color: var(--muted); }
.ask .ot { display: none; gap: 6px; margin-top: 6px; }
.ask .ot.on { display: flex; }
.ask .ot input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--text); outline: none; }
.ask .ot input:focus { border-color: var(--accent); }
.ask .ot button { background: var(--accent); border-color: var(--accent); color: #fff; text-align: center; }
.ask .done { margin-top: 6px; color: var(--muted); }
.ask.ready { border-color: rgba(123,198,126,.45); background: rgba(123,198,126,.06); }
.ask.ready .ah span:first-child { color: #7bc67e; }
.ask .rb { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
.ask .rb .go { background: linear-gradient(135deg, #e8906d, #c75f3e); border-color: transparent; color: #fff; font-weight: 600; text-align: center; }
.approve button { font: inherit; font-size: 13px; border-radius: 9px; padding: 6px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--raised); color: var(--text); }
.approve .yes { background: var(--accent); border-color: var(--accent); color: #fff; }
.approve .yes:hover { background: var(--accent-2); }

body.drop main::after { content: "Dépose tes fichiers ici"; position: absolute; inset: 10px; display: grid; place-items: center;
  border: 2px dashed var(--accent); border-radius: 16px; background: rgba(24,24,27,.88); color: var(--accent-2); font-size: 15px; font-weight: 600; }

.orb img, .avatar img { width: 88%; image-rendering: pixelated; }

/* ================= Habillage v2 : plus aéré, plus doux ================= */
header { padding: 12px 10px 10px 14px; gap: 8px; border-bottom: 1px solid rgba(var(--ov),.06); position: relative; z-index: 5; }
.orb { width: 34px; height: 34px; background: rgba(var(--ov),.06); box-shadow: none; }
#dir { display: none !important; }
#chat { overflow: hidden; }
header .icon-btn { flex: none; }
.chev { flex: none; color: var(--muted); transition: transform .2s; }
.icon-btn { width: 30px; height: 30px; border-radius: 9px; }

/* menu sobre */
.msec { font-size: 10.5px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: #6f6f79; padding: 10px 8px 4px; }
.mitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--text); background: none; border: 0;
  border-radius: 8px; padding: 6px 8px; cursor: pointer; }
.mitem:hover { background: rgba(var(--ov),.06); }
.mitem.on { background: rgba(217,119,87,.12); }
.mitem .ic { color: var(--accent-2); font-weight: 600; width: 12px; text-align: center; }
.mitem .tx { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mitem small { display: block; font-size: 11px; color: var(--muted); }
.mitem .del { opacity: 0; background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; border-radius: 6px; width: 22px; height: 22px; }
.mitem:hover .del { opacity: 1; }
.mitem .del.arm { opacity: 1; width: auto; padding: 0 7px; font-size: 12px; color: #f08a85; background: rgba(240,90,90,.12); }
.mitem .del:hover { color: #f08a85; background: rgba(240,100,100,.1); }
.mitem select.mvsel { flex: 1; min-width: 0; font: inherit; font-size: 12.5px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--accent); background: var(--raised); color: var(--text); }
.mnone { font-size: 12px; color: var(--muted); padding: 4px 8px; }
.mnewp { display: flex; gap: 4px; padding: 2px 4px; }
.mnewp input { flex: 1; min-width: 0; font: inherit; font-size: 12.5px; color: var(--text); background: rgba(var(--ov),.04); border: 1px solid rgba(var(--ov),.06); border-radius: 8px; padding: 5px 9px; outline: none; user-select: text; }
.mnewp input:focus { border-color: rgba(217,119,87,.5); }
.mnewp button { background: none; border: 0; color: var(--accent-2); font-size: 16px; cursor: pointer; width: 28px; border-radius: 8px; }
.mnewp button:hover { background: rgba(var(--ov),.06); }

/* bulles */
#log { padding: 20px 16px 12px; gap: 14px; }
.msg.user { background: linear-gradient(135deg, #d9785a, #c4603f); color: #fff; padding: 9px 14px; border-radius: 18px 18px 6px 18px;
  box-shadow: 0 6px 18px rgba(196,96,63,.25); max-width: 82%; animation: rise .22s ease; }
.msg.bot { background: rgba(var(--ov),.045); border: 1px solid rgba(var(--ov),.06); border-radius: 6px 18px 18px 18px; padding: 10px 14px; max-width: 94%; align-self: flex-start; }
.msg.bot:empty { display: none; }
.msg.bot .md > :first-child { margin-top: 0; } .msg.bot .md > :last-child { margin-bottom: 0; }
.tool { background: rgba(var(--ov),.04); border-color: rgba(var(--ov),.06); }
pre { background: rgba(var(--sunk),calc(.35 * var(--sk))); border-color: rgba(var(--ov),.06); }
.typing { padding: 2px 0; }
/* écriture en direct : la réponse apparaît mot par mot, petit curseur orange qui respire au bout du texte */
.msg.bot .md.live ~ .typing { display: none; }
.lc { display: inline-block; width: 7px; height: 7px; margin-left: 4px; border-radius: 50%; background: #d97757; vertical-align: middle; animation: lcp 1s ease-in-out infinite; }
@keyframes lcp { 50% { opacity: .25; transform: scale(.7); } }

/* zone de saisie */
footer { padding: 8px 12px 12px; }
.box { background: rgba(var(--ov),.05); border-color: rgba(var(--ov),.08); border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.box:focus-within { border-color: rgba(217,119,87,.45); }
#send { border-radius: 12px; }
body.flash .box { border-style: dashed; border-color: rgba(242,198,109,.45); }
body.flash #send:not(.stop) { background: #d9a94a; }
#empty h2 { font-size: 18px; } .chip { background: rgba(var(--ov),.04); border-color: rgba(var(--ov),.07); }

/* ================= Habillage v3 : tout arrondi, couleurs chaudes, fondu orange sur les bords ================= */
html, body { border-radius: 8px; overflow: hidden; }          /* même rayon que les coins Windows 11 : pas d angle mal fini */
body {
  background:
    rgba(17,17,21,.66);
}
body::after {                                   /* fondu orange léger tout autour */
  content: ""; position: fixed; inset: 0; border-radius: 8px; pointer-events: none; z-index: 60;
  box-shadow: inset 0 0 14px rgba(217,119,87,.13), inset 0 0 36px rgba(217,119,87,.06), inset 0 0 70px rgba(217,119,87,.025);   /* fondu très diffus, seulement sur les bords */
}
header { background: none; border-bottom: none; }                 /* plus de bande orange qui s arrête net */
main::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 1px; z-index: 2; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(var(--ov),.09) 20%, rgba(var(--ov),.09) 80%, transparent); }   /* séparation douce, fondue aux deux bouts */
.icon-btn, #send { border-radius: 50%; }
.icon-btn:hover { background: rgba(235,154,120,.14); color: var(--accent-2); }
#send { width: 36px; height: 36px; background: linear-gradient(135deg, #e8906d, #c75f3e); box-shadow: 0 4px 14px rgba(217,119,87,.35); }
#send:hover { background: linear-gradient(135deg, #f0a07f, #d06a48); }
#pin.on { color: var(--accent-2); background: rgba(235,154,120,.16); }
#pin.on svg { transform: rotate(-30deg); }
.orb { box-shadow: 0 0 0 1.5px rgba(235,154,120,.30); }
.msg.user { background: linear-gradient(135deg, #e48a67, #c65d3c); border-radius: 20px 20px 8px 20px; }
.msg.bot { background: rgba(var(--ov),.055); border: 1px solid rgba(var(--ov),.07); border-radius: 8px 20px 20px 20px; }
.tool { border-radius: 999px; background: rgba(var(--ov),.05); border-color: rgba(var(--ov),.08); }
pre { border-radius: 14px; } code { border-radius: 7px; }
.box { border-radius: 22px; background: rgba(var(--ov),.06); border-color: rgba(var(--ov),.09); }
.box:focus-within { border-color: rgba(235,154,120,.55); box-shadow: 0 0 0 3px rgba(217,119,87,.12), 0 8px 24px rgba(0,0,0,.2); }
kbd { border-radius: 7px; }
.switch .track, .track { border-radius: 999px; }
.ddmenu { border-radius: 18px; background: linear-gradient(170deg, rgba(36,28,30,.98), rgba(24,22,26,.98)); border-color: rgba(235,154,120,.18); }
.mitem, .mnewp input, .mnewp button { border-radius: 12px; }
.chip { border-radius: 16px; background: rgba(var(--ov),.05); border-color: rgba(var(--ov),.08); }
.chip:hover { border-color: rgba(235,154,120,.5); }
.approve, .err { border-radius: 16px; }
::-webkit-scrollbar-thumb { background: rgba(235,154,120,.25); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }

/* barre de quota (tokens restants), sobre */
#quota { display: none; gap: 16px; padding: 5px 16px 3px; font-size: 10.5px; color: var(--muted); }
#quota.on { display: flex; }
.q { flex: 1; display: flex; align-items: center; gap: 7px; min-width: 0; }
.q i { flex: 1; height: 3px; border-radius: 999px; background: rgba(var(--ov),.08); overflow: hidden; }
.q b { display: block; height: 100%; border-radius: 999px; transition: width .5s, background .5s; }
.q span { white-space: nowrap; }
.q em { font-style: normal; min-width: 30px; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }

/* ================= Habillage v4 : en-tête aéré, choix en un clic ================= */
html, body { font-size: 14.5px; }
body { background: rgba(18,18,23,.9); }                       /* fond uniforme jusqu'au bout (le bureau ne transparaît plus) */
header { padding: 16px 12px 6px 18px; gap: 12px; cursor: default; }
header .orb { width: 40px; height: 40px; }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.who b { font-size: 15.5px; font-weight: 600; }
#sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.flash #sub { color: #f2c66d; }
.hbtns { display: flex; gap: 2px; flex: none; }
.hbtns .icon-btn { width: 34px; height: 34px; }
.modebar { display: flex; align-items: center; gap: 8px; padding: 10px 18px 14px; position: relative; z-index: 6; }
.seg2 { display: flex; flex: none; padding: 3px; gap: 2px; border-radius: 999px; background: rgba(var(--ov),.05); border: 1px solid rgba(var(--ov),.07); }
.seg2 button { display: flex; align-items: center; gap: 5px; font: inherit; font-size: 12.5px; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 5px 13px; cursor: pointer; transition: background .15s, color .15s; }
.seg2 button:hover { color: var(--text); }
.seg2 button.on { background: rgba(235,154,120,.17); color: var(--accent-2); }
.seg2 #mFlash.on { background: rgba(242,198,109,.16); color: #f2c66d; }
.dd { position: relative; min-width: 0; }
#ddP { flex: 1; }
.ddbtn { display: flex; align-items: center; gap: 7px; width: 100%; font: inherit; font-size: 12.5px; color: var(--muted); background: rgba(var(--ov),.05);
  border: 1px solid rgba(var(--ov),.07); border-radius: 999px; padding: 6px 11px 6px 13px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.ddbtn:hover, .dd.open .ddbtn { background: rgba(235,154,120,.10); border-color: rgba(235,154,120,.28); color: var(--text); }
.ddbtn.has { color: var(--text); }
#projLabel { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dd.open .chev { transform: rotate(180deg); }
.ddmenu { position: absolute; top: calc(100% + 6px); left: 0; width: 280px; max-height: 400px; overflow-y: auto; z-index: 30; padding: 8px;
  box-shadow: 0 18px 40px rgba(0,0,0,.5); opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity .16s, transform .16s; }

.dd.open .ddmenu { opacity: 1; transform: none; pointer-events: auto; }
main::before { left: 22px; right: 22px; }
#log { padding: 22px 20px 14px; gap: 18px; }
.msg.user { padding: 10px 16px; } .msg.bot { padding: 12px 16px; }
footer { padding: 10px 16px 14px; }
.box { padding: 10px 10px 10px 18px; }
textarea { min-height: 28px; }
.opts { margin-top: 10px; gap: 16px; padding: 0 6px; }
#quota { padding: 0; flex: 1; max-width: 250px; gap: 14px; }
.q { gap: 6px; }
.q i { min-width: 26px; }
.q em { min-width: 0; }
.q small { font-size: 10.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.mitem .cnt { font-size: 11px; color: var(--muted); background: rgba(var(--ov),.06); border-radius: 999px; padding: 0 7px; flex: none; }
/* boutons Copier */
.msg { position: relative; }
.cpy { display: flex; align-items: center; gap: 5px; border: 0; cursor: pointer; font: inherit; font-size: 11.5px; transition: opacity .15s, background .15s, color .15s; }
.cpy.msgc { position: absolute; bottom: -4px; width: 26px; height: 26px; justify-content: center; border-radius: 50%; padding: 0;
  background: rgba(var(--pop),.95); color: var(--muted); border: 1px solid rgba(var(--ov),.09); opacity: 0; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.msg.bot .cpy.msgc { right: -8px; }
.msg.user .cpy.msgc { left: -32px; bottom: 4px; }
.msg:hover > .cpy.msgc, .cpy.ok { opacity: 1; }
.cpy.msgc:hover { color: var(--accent-2); border-color: rgba(235,154,120,.4); }
.cw { margin: .5em 0; border: 1px solid rgba(var(--ov),.07); border-radius: 14px; overflow: hidden; background: rgba(var(--sunk),calc(.35 * var(--sk))); }
.cw pre { margin: 0; border: 0; border-radius: 0; background: none; }
.cwh { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 4px 12px; font-size: 11px; color: var(--muted);
  background: rgba(var(--ov),.04); border-bottom: 1px solid rgba(var(--ov),.06); }
.cpy.code { padding: 3px 8px; border-radius: 8px; background: none; color: var(--muted); }
.cpy.code:hover { background: rgba(235,154,120,.16); color: var(--accent-2); }
.cpy.ok { color: #7bc67e !important; }
.msg.bot { margin-bottom: 6px; }
#lhint { display: none; font-size: 11.5px; color: var(--muted); padding: 0 10px 7px; }
#lhint.on { display: block; animation: rise .15s ease; }
#lhint b { color: var(--accent-2); font-weight: 600; }
#lhint kbd { font-size: 10.5px; }
/* ---- mises à jour : pastille sur l avatar (orange = nouvelle version, vert = mise à jour réussie) ---- */
#chat { position: relative; }
header { z-index: 7; }
/* rond de Bébène : discret au repos, ⚙ au survol (clic = réglages) ; pastille de mise à jour = petit bouton sur le bord */
.orbw { position: relative; flex: none; width: 40px; height: 40px; }
.orbb { position: relative; display: block; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: none; color: inherit; cursor: pointer; }
.orbw .orb { width: 40px; height: 40px; background: radial-gradient(circle at 50% 38%, #2f2b30, #1d1b20 72%);
  box-shadow: inset 0 0 0 1px rgba(235,154,120,.28), 0 2px 8px rgba(0,0,0,.35); transition: box-shadow .18s; }
.orbw .orb img { transition: opacity .18s, filter .18s, transform .18s; }
.orbb .gear { position: absolute; inset: 0; display: grid; place-items: center; color: #f3c1a8; opacity: 0; transform: rotate(-40deg) scale(.8);
  transition: opacity .18s, transform .3s; pointer-events: none; }
.orbb:hover .orb, .orbb:focus-visible .orb { box-shadow: inset 0 0 0 1.5px rgba(235,154,120,.75), 0 0 0 4px rgba(217,119,87,.16), 0 2px 8px rgba(0,0,0,.35); }
.orbb:hover .orb img, .orbb:focus-visible .orb img { opacity: .22; filter: blur(1px); transform: scale(.92); }
.orbb:hover .gear, .orbb:focus-visible .gear { opacity: 1; transform: none; }
.orbb:active .gear { transform: rotate(30deg) scale(.92); }
.orbb:focus { outline: none; }
.updot { position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 2px solid #17171c; display: none; cursor: pointer; z-index: 2; }
.updot::before { content: ''; position: absolute; inset: -6px; border-radius: 50%; }   /* zone de clic plus large que le point */
.orbw.new .updot { display: block; background: #f0a050; animation: updp 1.8s ease-in-out infinite; }
.orbw.ok .updot { display: block; background: #6fcf7a; box-shadow: 0 0 8px rgba(111,207,122,.75); }
@keyframes updp { 0%, 100% { box-shadow: 0 0 4px rgba(240,160,80,.6); } 50% { box-shadow: 0 0 0 4px rgba(240,160,80,.18), 0 0 12px rgba(240,160,80,.95); } }
.updot:hover::after { content: attr(data-tip); position: absolute; left: -24px; top: calc(100% + 10px); white-space: nowrap; font-size: 12px; color: var(--text);
  background: rgba(var(--pop),.97); border: 1px solid rgba(var(--ov),.12); border-radius: 10px; padding: 6px 11px; z-index: 50; pointer-events: none; box-shadow: 0 8px 20px rgba(0,0,0,.45); }
.orbw.new .updot:hover::after { border-color: rgba(240,160,80,.55); } .orbw.ok .updot:hover::after { border-color: rgba(111,207,122,.55); }
html.light .orbw .orb { background: radial-gradient(circle at 50% 38%, #fff, #efe6e1 72%); }
html.light .orbb .gear { color: #c8623f; }
html.light .updot { border-color: #fff; }
.updpop { position: absolute; top: 66px; left: 14px; width: 340px; z-index: 45; display: none; padding: 14px 14px 12px; border-radius: 16px; font-size: 13px;
  background: linear-gradient(170deg, rgba(38,30,32,.99), rgba(25,23,27,.99)); border: 1px solid rgba(240,160,80,.3); box-shadow: 0 18px 40px rgba(0,0,0,.5); }
.updpop.ok { border-color: rgba(111,207,122,.35); }
#notepop { left: auto; right: 14px; width: 300px; }
#notepop .nh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
#notepop .nl { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
#notepop .ni { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: rgba(var(--ov),.04); }
#notepop .ni:hover { background: rgba(235,154,120,.08); }
#notepop .ni .dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }
#notepop .ni .tt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
#notepop .ni.off .tt { color: var(--muted); }
#notepop .ni .st { font-size: 11px; color: var(--muted); flex: none; margin: 0; }
#notepop .ni button { padding: 3px 8px; font-size: 11.5px; border-radius: 8px; }
#notepop .ni button.del { color: #f08a85; }
#notepop .empty { color: var(--muted); font-size: 12.5px; padding: 6px 2px; }
#notes .nc { position: absolute; top: 3px; right: 2px; min-width: 15px; height: 15px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 9.5px; font-weight: 700; display: none; align-items: center; justify-content: center; padding: 0 3px; }
#notes { position: relative; }
#notes.has .nc { display: flex; }
.updpop.open { display: block; animation: rise .16s ease; }
.updpop h4 { font-size: 14.5px; font-weight: 600; margin-bottom: 3px; }
.updpop .sub { color: var(--muted); font-size: 12px; margin-bottom: 9px; }
.updpop .notes { max-height: 190px; overflow-y: auto; font-size: 12.5px; padding: 8px 11px; border-radius: 10px; background: rgba(var(--sunk),calc(.25 * var(--sk))); margin-bottom: 10px; user-select: text; }
.updpop .notes h3 { font-size: 12.5px; margin: .5em 0 .2em; } .updpop .notes ul { padding-left: 1.1em; margin: .2em 0; } .updpop .notes p { margin: .3em 0; }
.updpop .st { font-size: 12px; color: var(--accent-2); margin-bottom: 9px; }
.updpop .st.err { color: #f08a85; }
.updpop .row { display: flex; gap: 8px; justify-content: flex-end; }
.updpop button { font: inherit; font-size: 12.5px; border-radius: 10px; padding: 6px 13px; cursor: pointer; border: 1px solid rgba(var(--ov),.1); background: rgba(var(--ov),.06); color: var(--text); }
.updpop button.pri { background: linear-gradient(135deg, #e8906d, #c75f3e); border-color: transparent; color: #fff; }
.updpop.ok button.pri { background: linear-gradient(135deg, #6fcf7a, #3f9a4c); }
.updpop button:disabled { opacity: .5; cursor: default; }
/* note de compactage dans la conversation */
.note { align-self: center; font-size: 11.5px; color: var(--muted); background: rgba(var(--ov),.04); border: 1px solid rgba(var(--ov),.07); border-radius: 999px; padding: 4px 13px; text-align: center; max-width: 92%; }
.note.run { color: var(--accent-2); }
/* Buy Me a Coffee : tasse dorée au survol, la vapeur monte */
.icon-btn.coffee:hover { color: #f2c66d; background: rgba(242,198,109,.14); }
.coffee .steam { opacity: .55; transition: opacity .2s; }
.coffee:hover .steam { opacity: 1; animation: steam 1.2s ease-in-out infinite; }
@keyframes steam { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.2px); } }
/* multitâche : étapes, besoin de toi, état des conversations */
.plan { margin: 6px 0; padding: 8px 11px; border-radius: 12px; background: rgba(var(--ov),.04); border: 1px solid rgba(var(--ov),.07); font-size: 12.5px; }
.plan .ph { display: flex; justify-content: space-between; color: var(--muted); font-size: 11.5px; margin-bottom: 4px; text-transform: uppercase; letter-spacing: .04em; }
.plan .ph b { color: var(--accent-2); }
.plan .pi { display: flex; gap: 7px; padding: 2px 0; color: var(--muted); }
.plan .pi .pc { width: 14px; height: 14px; flex: none; border-radius: 4px; border: 1px solid rgba(var(--ov),.18); font-size: 10px; display: grid; place-items: center; margin-top: 2px; }
.plan .pi.completed { text-decoration: line-through; opacity: .7; }
.plan .pi.completed .pc { background: #7bc67e; border-color: #7bc67e; color: #fff; }
.plan .pi.in_progress { color: var(--text); font-weight: 600; }
.plan .pi.in_progress .pc { border-color: var(--accent); color: var(--accent); }
.ask.hand { border-color: rgba(240,160,80,.55); }
.ask .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
.approve .all { color: var(--accent-2); }
.mitem .cst { margin-right: 6px; }
/* poignées de redimensionnement (invisibles, sur les bords) */
.rsz { position: fixed; z-index: 90; }
.rsz-n, .rsz-s { left: 10px; right: 10px; height: 5px; cursor: ns-resize; } .rsz-n { top: 0; } .rsz-s { bottom: 0; }
.rsz-e, .rsz-w { top: 10px; bottom: 10px; width: 5px; cursor: ew-resize; } .rsz-e { right: 0; } .rsz-w { left: 0; }
.rsz-ne, .rsz-nw, .rsz-se, .rsz-sw { width: 12px; height: 12px; }
.rsz-nw { top: 0; left: 0; cursor: nwse-resize; } .rsz-se { bottom: 0; right: 0; cursor: nwse-resize; }
.rsz-ne { top: 0; right: 0; cursor: nesw-resize; } .rsz-sw { bottom: 0; left: 0; cursor: nesw-resize; }
/* ================= Mode clair (réglages > Compagnon) : classe .light sur <html> ================= */
:root { --ov: 255,255,255; --pop: 30,30,36; --sunk: 0,0,0; --sk: 1; --track: #3b3b42; }
html.light { --bg: rgba(250,247,244,.7); --surface: rgba(255,255,255,.85); --raised: rgba(236,230,225,.95); --line: rgba(40,30,30,.11);
  --text: #23202a; --muted: #6e6873; --accent: #c8623f; --accent-2: #b4542f; --ov: 40,30,35; --pop: 252,249,246; --sunk: 90,60,40; --sk: .22; --track: #cdc6c0; }
html.light body { background: rgba(248,245,241,.97); }
html.light body.drop main::after { background: rgba(250,247,244,.92); }
html.light .ddmenu { background: linear-gradient(170deg, rgba(255,251,248,.99), rgba(246,241,237,.99)); border-color: rgba(200,98,63,.22); }
html.light .updpop { background: linear-gradient(170deg, rgba(255,251,248,.99), rgba(246,241,237,.99)); }
html.light body.flash #sub, html.light .icon-btn.coffee:hover { color: #a87512; }
html.light .box:focus-within { border-color: rgba(200,98,63,.5); }
html.light .approve, html.light .ask { border-color: rgba(200,98,63,.35); }
html.light ::-webkit-scrollbar-thumb { background: rgba(40,30,35,.18); }
/* ================= v1.50 ================= */
/* recherche en cours : ligne temporaire (retirée à la fin) */
.srch { display: flex; align-items: center; gap: 8px; width: fit-content; max-width: 100%; font-size: 12.5px; color: var(--muted); padding: 4px 11px; margin: 5px 0;
  border-radius: 999px; background: rgba(var(--ov),.05); border: 1px dashed rgba(235,154,120,.35); animation: srchp 1.6s ease-in-out infinite; }
.srch .si { flex: none; }
.srch .st { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes srchp { 50% { opacity: .55; } }
/* modification de fichier : une seule ligne, dépliable */
.diff summary { display: flex; align-items: center; gap: 7px; max-width: 100%; list-style: none; padding: 3px 11px; border-radius: 999px; background: rgba(var(--ov),.05); border: 1px solid rgba(var(--ov),.08); margin: 5px 0 0; }
.diff summary::-webkit-details-marker { display: none; }
.diff summary i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.diff summary span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.diff summary em { flex: none; font-style: normal; font-size: 11px; color: var(--accent-2); }
.diff[open] summary em { opacity: .6; }
.diff pre { margin-top: 6px; }
/* menu clic droit sur une réponse */
#ctxm { position: fixed; z-index: 70; display: none; min-width: 205px; padding: 5px; border-radius: 12px; background: rgba(var(--pop),.98); border: 1px solid rgba(var(--ov),.12); box-shadow: 0 14px 34px rgba(0,0,0,.45); }
#ctxm.open { display: block; }
#ctxm button { display: flex; align-items: center; gap: 9px; width: 100%; font: inherit; font-size: 13px; color: var(--text); background: none; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer; text-align: left; }
#ctxm button:hover { background: rgba(217,119,87,.14); }
#ctxm svg { flex: none; color: var(--muted); }
/* petit message en bas */
#toast { position: fixed; left: 50%; bottom: 118px; transform: translate(-50%, 8px); z-index: 80; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 40px);
  font-size: 12.5px; padding: 8px 14px; border-radius: 12px; background: rgba(var(--pop),.98); border: 1px solid rgba(111,207,122,.45); box-shadow: 0 10px 26px rgba(0,0,0,.4);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast.open { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#toast.err { border-color: rgba(240,90,90,.5); }
/* recherche dans l'historique */
.mitem small.snip { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 2px; }
.mitem small.snip mark { background: rgba(217,119,87,.3); color: var(--text); border-radius: 3px; padding: 0 1px; }
/* rappel programmé dans la conversation */
.rcard { border: 1px solid rgba(217,119,87,.4); background: rgba(217,119,87,.06); border-radius: 14px; padding: 9px 12px; font-size: 13px; animation: rise .25s ease; }
.rcard .rh { font-weight: 600; display: flex; gap: 7px; }
.rcard .rq { margin: 4px 0 7px 23px; }
.rcard .rx { margin-left: 23px; font: inherit; font-size: 12px; border-radius: 9px; padding: 4px 10px; cursor: pointer; border: 1px solid var(--line); background: var(--raised); color: var(--muted); }
.rcard .rx:hover { color: var(--text); border-color: var(--accent); }
.rcard .rdone { margin-left: 23px; color: var(--muted); font-size: 12px; }
/* texte sélectionné dans une autre appli */
#selbar { display: none; margin: 0 2px 8px; border: 1px solid rgba(217,119,87,.35); background: rgba(217,119,87,.07); border-radius: 14px; padding: 8px 10px; font-size: 12.5px; animation: rise .2s ease; }
#selbar.on { display: block; }
#selbar .sh { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
#selbar .sq { color: var(--muted); margin: 4px 0 7px; max-height: 3.9em; overflow: hidden; white-space: pre-wrap; }
#selbar .sb { display: flex; flex-wrap: wrap; gap: 6px; }
#selbar .sb button { font: inherit; font-size: 12px; border-radius: 9px; padding: 4px 9px; cursor: pointer; border: 1px solid var(--line); background: var(--raised); color: var(--text); }
#selbar .sb button:hover { border-color: var(--accent); }
#selbar .x, #brief .x { background: none; border: 0; color: var(--muted); font-size: 17px; cursor: pointer; line-height: 1; padding: 0 4px; }
/* point du jour */
#brief { display: none; position: absolute; left: 12px; right: 12px; top: 10px; z-index: 6; max-height: calc(100% - 20px); overflow-y: auto;
  background: rgba(var(--pop),.97); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px 8px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: rise .25s ease; }
#brief.on { display: block; }
#brief .bh { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
#brief .bs { color: var(--accent-2); font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin: 9px 0 3px; }
#brief .bi { display: flex; gap: 9px; padding: 3px 0; width: 100%; text-align: left; font: inherit; color: var(--text); background: none; border: 0; }
#brief .bi b { min-width: 52px; color: var(--muted); font-weight: 500; }
#brief .bc { cursor: pointer; border-radius: 8px; }
#brief .bc:hover { background: rgba(var(--ov),.06); }
#brief .bn { color: var(--muted); }
#brief .bt { font-style: normal; font-size: 10.5px; border-radius: 5px; padding: 0 5px; margin-left: 3px; }
#brief .bt.ex { background: rgba(240,140,135,.18); color: #f08c87; }
#brief .bt.rv { background: rgba(140,196,230,.18); color: #8cc4e6; }
#brief .bt.ml { background: rgba(var(--ov),.08); color: var(--muted); }
#brief .bf { margin-top: 8px; text-align: right; }
#brief .bf a { color: var(--muted); font-size: 11.5px; }
#toast u { color: var(--accent-2); }
/* pause de quota */
.pause { margin: 8px 0 4px; padding: 12px 14px; border-radius: 14px; background: rgba(224,184,79,.07); border: 1px solid rgba(224,184,79,.35); font-size: 13px; }
.pause.done { opacity: .75; }
.pause .ph { font-weight: 600; }
.pause .pq { font-size: 12px; color: var(--muted); margin: 2px 0 4px; }
.pause .pk { font-size: 10.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #a89c80; margin: 9px 0 2px; }
.pause ul { margin: 0; padding-left: 18px; }
.pause li { margin: 1px 0; }
.pause li.ok { color: var(--muted); }
.pause li.ok::marker { content: '✓  '; color: #7bc67e; }
.pause .req { white-space: pre-wrap; max-height: 90px; overflow: auto; }
.pause .pn { font-size: 12px; color: var(--muted); margin-top: 10px; }
.pause .pst { font-size: 12px; color: #e0b84f; margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pause .pst:empty { display: none; }
.pause .pb { display: flex; justify-content: flex-end; margin-top: 10px; }
.pause .go { font: inherit; font-size: 13px; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 9px; padding: 7px 14px; cursor: pointer; }
.pause .go.sec { background: rgba(var(--ov),.09); color: var(--text); font-weight: 500; padding: 5px 11px; }
.pause .pdone { font-size: 12px; color: var(--muted); }
html.light .pause .pk { color: #8a7a52; }
/* historique : sous-groupes, renommer */
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mgadd { font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--accent-2); background: none; border: 0; border-radius: 6px; padding: 2px 7px; cursor: pointer; }
.mgadd:hover { background: rgba(235,154,120,.12); }
.mgrp { display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin-top: 2px; border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer; user-select: none; }
.mgrp:hover { background: rgba(var(--ov),.05); }
.mgrp .gch { flex: none; width: 10px; color: var(--muted); font-size: 10px; transition: transform .15s; }
.mgrp.open .gch { transform: rotate(90deg); }
.mgrp .gn { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mgrp .cnt { font-size: 11px; font-weight: 400; color: var(--muted); background: rgba(var(--ov),.06); border-radius: 999px; padding: 0 7px; flex: none; }
.mgrp.loose { cursor: default; font-size: 10.5px; letter-spacing: .6px; text-transform: uppercase; color: #6f6f79; padding-top: 10px; }
.mgrp.loose:hover { background: none; }
.mgrp .rn, .mitem .rn { opacity: 0; background: none; border: 0; color: var(--muted); font-size: 12px; cursor: pointer; border-radius: 6px; width: 22px; height: 22px; flex: none; }
.mgrp .del { opacity: 0; background: none; border: 0; color: var(--muted); font-size: 15px; cursor: pointer; border-radius: 6px; width: 22px; height: 22px; flex: none; }
.mgrp:hover .rn, .mgrp:hover .del, .mitem:hover .rn, .mgrp .del.arm { opacity: 1; }
.mgrp .del.arm { width: auto; padding: 0 7px; font-size: 12px; font-weight: 400; color: #f08a85; background: rgba(240,90,90,.12); }
.mgrp .rn:hover, .mitem .rn:hover { color: var(--accent-2); background: rgba(235,154,120,.12); }
.mgrp .del:hover { color: #f08a85; background: rgba(240,100,100,.1); }
.mitem.ing { padding-left: 24px; }
.mnone.gin { padding-left: 26px; font-size: 12px; }
input.ren, input.gren { flex: 1; min-width: 0; font: inherit; font-size: 13px; font-weight: 400; padding: 4px 7px; border-radius: 7px; border: 1px solid var(--accent); background: var(--raised); color: var(--text); outline: none; }
#sub { cursor: text; }
/* ---- palette unique (Ctrl+K) : remplace les menus # Projet et Historique ---- */
#ddP { position: static; flex: 1; }
.modebar { position: relative; }
#ddProj { gap: 8px; }
#ddProj .kk { opacity: .55; }
#ddProj.attn { position: relative; }
#ddProj.attn::after { content: ""; position: absolute; top: 2px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px rgba(240,160,80,.8); }
.kk { font: 10.5px "Segoe UI", sans-serif; color: var(--muted); background: rgba(var(--ov),.06); border: 1px solid rgba(var(--ov),.09); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; flex: none; }
.pdot { width: 10px; height: 10px; border-radius: 3.5px; flex: none; background: hsl(var(--h, 20) 62% 62%); box-shadow: 0 0 8px hsla(var(--h, 20), 62%, 62%, .5); }
#projDot.none { background: none; box-shadow: none; border: 1.5px solid var(--muted); opacity: .6; }
#ddP .ddmenu.pal { left: 12px; right: 12px; width: auto; top: calc(100% - 4px); max-height: calc(100vh - 140px); padding: 0; overflow: hidden; display: flex; flex-direction: column;
  border: 1px solid rgba(235,154,120,.18); box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.2); transform: translateY(-8px) scale(.985); transform-origin: top center; transition: opacity .18s, transform .22s cubic-bezier(.2,.9,.3,1.2); }
#ddP.open .ddmenu.pal { transform: none; }
#ddP .ddmenu.pal { background: linear-gradient(170deg, rgba(34,27,30,.995), rgba(22,20,25,.995)); }
html.light #ddP .ddmenu.pal { background: linear-gradient(170deg, rgba(255,251,248,.997), rgba(246,241,237,.997)); }
.ptile.kb { outline: 2px solid hsla(var(--h), 70%, 65%, .9); outline-offset: 1px; }
.ptile.none.kb { outline-color: rgba(235,154,120,.8); }
.ptile[hidden] { display: none; }
.psearch { display: flex; align-items: center; gap: 9px; padding: 12px 14px; border-bottom: 1px solid rgba(var(--ov),.07); color: var(--muted); }
.psearch input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--text); background: none; border: 0; outline: none; user-select: text; }
.psearch input::-webkit-search-cancel-button { display: none; }
.pbody { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 8px; }
.psec { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase; color: #77727d; padding: 10px 4px 6px; }
.pbody .mnewp { margin-bottom: 6px; }
#pNewBox[hidden] { display: none; }
.ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; max-height: 172px; overflow-y: auto; padding: 1px; }
.pgrid { display: contents; }
.ptile { --h: 20; position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0; text-align: left; font: inherit; color: var(--text); cursor: pointer;
  padding: 9px 10px 8px; border-radius: 12px; border: 1px solid rgba(var(--ov),.07);
  background: linear-gradient(160deg, hsla(var(--h), 60%, 60%, .13), hsla(var(--h), 60%, 50%, .03) 70%); transition: transform .14s, border-color .14s, background .14s; }
.ptile:hover, .ptile.kb { transform: translateY(-1px); border-color: hsla(var(--h), 65%, 65%, .55); background: linear-gradient(160deg, hsla(var(--h), 60%, 60%, .22), hsla(var(--h), 60%, 50%, .06) 70%); }
.ptile.on { border-color: hsla(var(--h), 70%, 65%, .8); box-shadow: 0 0 0 1px hsla(var(--h), 70%, 65%, .35) inset, 0 6px 18px hsla(var(--h), 60%, 40%, .25); }
.ptile .pi { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 4px;
  background: linear-gradient(140deg, hsl(var(--h) 62% 62%), hsl(var(--h) 55% 46%)); box-shadow: 0 3px 10px hsla(var(--h), 60%, 45%, .4); }
.ptile .pn { font-size: 12.5px; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptile small { font-size: 11px; color: var(--muted); }
.ptile .pst { position: absolute; top: 7px; right: 8px; font-size: 11px; }
.ptile.arch { opacity: .6; } .ptile.arch .pi { filter: grayscale(.7); }
.ptile.none { background: rgba(var(--ov),.035); } .ptile.none .pi { background: rgba(var(--ov),.1); color: var(--muted); box-shadow: none; }
.ptile.none:hover, .ptile.none.kb, .ptile.none.on { border-color: rgba(235,154,120,.45); background: rgba(var(--ov),.06); }
.pbody .mitem.kb { background: rgba(235,154,120,.14); box-shadow: inset 2px 0 0 var(--accent); }
.mitem.start { color: var(--accent-2); font-weight: 600; }
.mitem.start .ic { font-size: 15px; }
.pfoot { display: flex; align-items: center; gap: 4px; padding: 7px 10px; border-top: 1px solid rgba(var(--ov),.07); background: rgba(var(--sunk),calc(.12 * var(--sk))); }
.plink { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; border-radius: 8px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
.plink:hover { color: var(--text); background: rgba(var(--ov),.06); }
.pkeys { margin-left: auto; display: flex; gap: 3px; opacity: .6; }
.pkeys kbd { font-size: 10px; }
html.light .ptile .pn { color: var(--text); }
html.light .psec { color: #8a8290; }
/* ---- glisser-déposer des conversations ---- */
.mitem.conv { position: relative; }
.mitem .grip { flex: none; width: 10px; margin: 0 -4px 0 -4px; color: var(--muted); font-size: 12px; opacity: 0; cursor: grab; transition: opacity .12s; }
.mitem.conv:hover .grip { opacity: .7; }
body.dragging, body.dragging * { cursor: grabbing !important; }
body.dragging .mitem.conv:hover { background: none; }
body.dragging .mitem .rn, body.dragging .mitem .del, body.dragging .mgrp .rn, body.dragging .mgrp .del { visibility: hidden; }
.mitem.dsrc { opacity: .35; outline: 1px dashed rgba(235,154,120,.5); outline-offset: -1px; }
#dghost { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; max-width: 240px; padding: 7px 11px; border-radius: 11px;
  background: rgba(var(--pop),.97); border: 1px solid rgba(var(--ov),.14); box-shadow: 0 12px 30px rgba(0,0,0,.45); transform-origin: 0 0; rotate: -2deg; }
#dghost b { display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dghost small { display: block; font-size: 11px; color: var(--muted); }
#dghost.ok { border-color: rgba(235,154,120,.6); }
#dghost.ok small { color: var(--accent-2); }
.dz { margin: 4px 0 6px; padding: 9px 10px; border: 1.5px dashed rgba(235,154,120,.35); border-radius: 12px; font-size: 12px; color: var(--muted); text-align: center; transition: background .12s, border-color .12s, color .12s; }
.mgrp.dov, .dz.dov, .mgrp.loose.dov { background: rgba(235,154,120,.16) !important; color: var(--accent-2); box-shadow: inset 0 0 0 1.5px rgba(235,154,120,.65); }
body.dragging .mgrp.loose { padding: 8px; border-radius: 8px; }
.ptile.dov { transform: translateY(-2px) scale(1.03); border-color: hsla(var(--h), 70%, 65%, .95); }
.ptile.none.dov { border-color: rgba(235,154,120,.8); }
.ptile.spring::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 4px; height: 2px; border-radius: 2px; background: hsl(var(--h) 70% 65%); transform-origin: left; animation: spring .6s linear forwards; }
.ptile.none.spring::after { background: var(--accent-2); }
@keyframes spring { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.ptile.view:not(.on) { border-style: dashed; border-color: hsla(var(--h), 70%, 65%, .7); }
.ptile.none.view:not(.on) { border-color: rgba(235,154,120,.6); }
/* ---- réponse arrivée : détails du travail repliés en une ligne ---- */
details.acts { margin-top: 8px; font-size: 12px; }
details.acts > summary { list-style: none; display: inline-flex; align-items: center; gap: 8px; color: var(--muted); cursor: pointer; padding: 3px 10px; border-radius: 999px; background: rgba(var(--ov),.05); border: 1px solid rgba(var(--ov),.07); }
details.acts > summary::-webkit-details-marker { display: none; }
details.acts > summary em { font-style: normal; color: var(--accent-2); opacity: .8; }
details.acts > summary:hover { color: var(--text); border-color: rgba(235,154,120,.35); }
details.acts[open] > summary em { opacity: 0; }
details.acts[open] > summary { margin-bottom: 8px; }
details.acts .plan { margin: 0 0 8px; }
/* ---- zone de saisie : grandit avec le texte, sans barre tant que tout tient ---- */
textarea#input { overflow-y: hidden; line-height: 1.5; min-height: 0; height: 31px; max-height: none; scrollbar-width: thin; }
/* ---- brouillon : sélections capturées par le raccourci (puces) + destination de la nouvelle conversation ---- */
#selbar { border-color: rgba(var(--ov),.08); background: rgba(var(--ov),.035); padding: 8px 10px; }
.ddest { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.ddest:last-child { margin-bottom: 0; }
.ddest b { color: var(--accent-2); font-weight: 600; }
.ddest select { font: inherit; font-size: 12px; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 2px 6px; }
.dchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dchip { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; min-width: 0; font-size: 12px; padding: 3px 4px 3px 9px; border-radius: 999px;
  background: rgba(217,119,87,.12); border: 1px solid rgba(217,119,87,.28); white-space: nowrap; }
.dchip .dl { min-width: 0; overflow: hidden; text-overflow: ellipsis; }   /* nom long : coupé avec « … », la croix reste toujours visible */
.dchip button { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; line-height: 1; }
.dchip button:hover { background: rgba(240,100,100,.15); color: #f08a85; }
.dclr { font: inherit; font-size: 11.5px; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.dclr:hover { color: var(--text); background: rgba(var(--ov),.06); }
#selbar .sb { margin-top: 8px; }
</style>
</head>
<body>
<div id="chat">
<header>
  <!-- le rond = Bébène ; au survol, ⚙ apparaît dessus : clic = réglages. La pastille (mise à jour) est un bouton à part. -->
  <div class="orbw" id="orbw">
    <button class="orbb" id="cfg" title="Réglages" aria-label="Réglages"><div class="orb" id="orb"></div>
      <span class="gear"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span></button>
    <button class="updot" id="updot" title=""></button>
  </div>
  <div class="who"><b id="name">Bébène</b><span id="sub">Prêt à t'aider</span></div>
  <span class="dir" id="dir" hidden>…</span>
  <div class="hbtns">
    <button class="icon-btn coffee" id="coffee" title="Offrir un café à l'auteur de Bébène ☕ (Buy Me a Coffee)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="steam" d="M7 2.5c-.6.9.6 1.6 0 2.5M11 2.5c-.6.9.6 1.6 0 2.5M15 2.5c-.6.9.6 1.6 0 2.5"/><path d="M4 8.5h13v6.5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/></svg>
    </button>
    <button class="icon-btn" id="notes" title="Post-it" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v10l-6 6H4z"/><path d="M14 20v-6h6"/><path d="M8 9h8M8 13h4"/></svg><span class="nc" id="nc"></span>
    </button>
    <button class="icon-btn" id="new" title="Nouvelle conversation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
    <button class="icon-btn" id="pin" title="Épingler : garder ouverte quand je clique ailleurs">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg>
    </button>
    <button class="icon-btn" id="close" title="Fermer (Échap)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</header>

<div class="updpop" id="updpop"></div>
<div class="updpop" id="notepop"></div>
<div id="ctxm"></div>
<div id="toast"></div>

<!-- barre de choix : mode (toggle) + menus dépliants Projet et Historique -->
<div class="modebar">
  <div class="seg2" role="tablist">
    <button id="mNormal" class="on" title="Conversation enregistrée dans l'historique">Conversation</button>
    <button id="mFlash" title="Rien n'est enregistré : ni historique, ni archive">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>Flash</button>
  </div>
  <!-- palette unique (Ctrl+K) : recherche, projets en tuiles, conversations du projet -->
  <div class="dd" id="ddP">
    <button class="ddbtn" id="ddProj" title="Projets et conversations (Ctrl+K)"><span class="pdot" id="projDot"></span><span id="projLabel">Aucun projet</span>
      <kbd class="kk">Ctrl K</kbd>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="ddmenu pal" id="pal">
      <div class="psearch">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="mSearch" type="search" placeholder="Chercher un projet ou une conversation…" autocomplete="off">
        <kbd class="kk">Échap</kbd>
      </div>
      <div class="pbody">
        <div class="psec"><span>Projets</span><button class="mgadd" id="pNew" title="Créer un projet">＋ Nouveau</button></div>
        <div class="mnewp" id="pNewBox" hidden><input id="mProjName" placeholder="Nom du nouveau projet…" maxlength="40"><button id="mProjAdd" title="Créer le projet">＋</button></div>
        <div class="ptiles">
          <button class="ptile none" id="mNoProj" title="Conversations sans projet"><span class="pi">∅</span><span class="pn">Sans projet</span><small id="noProjCnt"></small></button>
          <div id="mProjects" class="pgrid"></div>
        </div>
        <div class="psec mhead"><span id="mConvTitle">Conversations récentes</span><button class="mgadd" id="mGroupAdd" title="Créer un sous-groupe pour ranger les conversations">＋ Groupe</button></div>
        <div id="mConvs"></div>
      </div>
      <div class="pfoot">
        <button class="plink" id="mFolder" title="Travailler dans un autre dossier">📂 Autre dossier…</button>
        <button class="plink" id="pArchived" title="Gérer les projets archivés dans les réglages" hidden></button>
        <button class="plink" id="term" title="Continuer cette conversation dans le terminal">Terminal ›</button>
        <span class="pkeys"><kbd>↑↓</kbd> <kbd>↵</kbd></span>
      </div>
    </div>
  </div>
</div>

<main>
  <div id="brief"></div>
  <div id="log"></div>
  <div id="empty">
    <div class="orb"></div>
    <h2>Salut ! On fait quoi ?</h2>
    <p>Pose-moi une question, demande-moi d'agir sur tes fichiers,<br>ou dépose un fichier ici (ou sur moi).</p>
    <div class="chips">
      <button class="chip" data-q="Fais-moi un état des lieux de mon dossier Téléchargements et propose un rangement.">📂 Ranger mes Téléchargements</button>
      <button class="chip" data-q="Quels sont les plus gros fichiers et dossiers dans mon dossier actuel ?">📊 Trouver ce qui prend de la place</button>
      <button class="chip" data-q="Aide-moi à rédiger un e-mail professionnel. Demande-moi d'abord le contexte.">✍️ Rédiger un e-mail</button>
    </div>
  </div>
</main>

<footer>
  <div id="selbar"></div>
  <div id="lhint"></div>
  <div class="box">
    <textarea id="input" rows="1" placeholder="Écris à Claude…"></textarea>
    <button id="send" disabled title="Envoyer (Entrée)">
      <svg id="ico-send" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      <svg id="ico-stop" width="12" height="12" viewBox="0 0 12 12" style="display:none"><rect width="12" height="12" rx="2.5" fill="currentColor"/></svg>
    </button>
  </div>
  <div class="opts">
    <label class="switch" title="Activé : Claude agit sans demander. Désactivé : il modifie les fichiers du dossier de travail, et te demande avant de lancer une commande.">
      <input type="checkbox" id="auto"><span class="track"></span>Mode autonome
    </label>
    <div id="quota" title="Ce qu'il te reste sur tes limites Claude">
      <div class="q" id="qs"><span>5 h</span><i><b id="q5"></b></i><em id="q5t"></em><small id="q5r"></small></div>
      <div class="q" id="qw"><span>sem.</span><i><b id="q7"></b></i><em id="q7t"></em><small id="q7r"></small></div>
    </div>
  </div>
</footer>
</div>

<script>
const $ = s => document.querySelector(s);
let log = $('#log'); const input = $('#input'), send = $('#send'), auto = $('#auto');   // log : le fil de la conversation affichée (chaque tâche a le sien)
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },

// ---- conversations enregistrées, projets, mode flash ----
// Historique : un fichier par conversation, géré par Bébène (window.__CONVS, injecté avant ce script).
// Sans Bébène (tests) : stockage local de la page, comme avant.
const FILES = Array.isArray(window.__CONVS);
let convs = []; try { convs = FILES ? window.__CONVS : JSON.parse(store.get('convs', '[]')) || []; } catch { convs = []; }
let migrate = false;
if (FILES) {
  if (!convs.length) { try { const old = JSON.parse(store.get('convs', '[]')) || []; if (old.length) { convs = old; migrate = true; } } catch { } }   // 1re fois : reprise de l'ancien stockage
  else try { localStorage.removeItem('convs'); } catch { }                                                                                     // déjà dans les fichiers : place libérée
}
const sent = new Map();                    // dernier état enregistré de chaque conversation (copie superficielle) : on n'écrit que ce qui a changé
const snapOf = c => { const s = {}; for (const k in c) s[k] = Array.isArray(c[k]) ? c[k].slice() : c[k]; return s; };
function convChanged(c) {                  // comparaison champ par champ : pas de JSON.stringify de tout l'historique à chaque sauvegarde
  const s = sent.get(c.id); if (!s) return true;
  const ks = Object.keys(c); if (ks.length !== Object.keys(s).length) return true;
  return ks.some(k => { const a = c[k], b = s[k]; return Array.isArray(a) ? !Array.isArray(b) || a.length !== b.length || a.some((x, i) => x !== b[i]) : a !== b; });
}
if (FILES && !migrate) convs.forEach(c => sent.set(c.id, snapOf(c)));
// ---- projet annoncé par Claude (« 📁 Projet : <nom> », celui qui déclenche l'archivage) ----
function projName(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9._-]+/g, '-').replace(/^[-.]+|[-.]+$/g, '');
}
function projectIn(text) {
  const m = [...String(text || '').matchAll(/📁\s*Projet\s*:\s*[`*]*([A-Za-z0-9À-ÿ][A-Za-z0-9À-ÿ._-]*)/g)].pop();
  const n = m ? projName(m[1]) : '';
  return n && n !== 'claude-companion' && n !== 'nom' ? n : '';
}
// une seule fois : les anciennes conversations archivées dans un projet mais restées « sans projet » dans l'historique
(function () {
  let fixed = 0;
  if (store.get('projfix', '') === '1') { if (migrate) persist(); return; }     // déjà fait : on ne relit plus tout l'historique à chaque démarrage
  store.set('projfix', '1');
  convs.forEach(c => { if (!c.project && c.hist) { const n = projectIn(c.hist.replace(/<[^>]+>/g, '')); if (n) { c.project = n; fixed++; } } });
  if (fixed || migrate) persist();
})();

  store.set('hist', ''); store.set('sid', '');
}

let gArm = '', gEdit = null, cEdit = '';      // groupe à confirmer (suppression) ; groupe en cours de saisie ({ name } ou { name: null } = nouveau) ; conversation renommée
let ptrDown = false, menuDirty = false;   // bouton de souris enfoncé ; menu à redessiner après le clic

let ARCH = new Set();                                                 // projets archivés (cachés de la palette, gérés dans les réglages)
const hueOf = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };   // couleur stable par projet
let granted = new Set(conv && conv.granted ? conv.granted : []);   // actions autorisées pour la conversation en cours
let lastCtx = 0, compacting = false, compactNote = null;
let turn = null, quotaStop = null;   // tâche en cours : demande, fichiers modifiés, étapes (résumé si pause de quota)              // compactage (déclaré avant le premier refresh())
let sid = conv ? conv.sid || '' : '', busy = false, cur = null, gotResult = false, denials = [], pendingAsk = null, pendingReady = null;
// ---- plusieurs tâches en même temps ----
// Chaque conversation qui travaille a sa « vue » : son fil (élément log), sa session, son état. La vue affichée occupe les variables
// globales ; une tâche qui tourne en fond garde la sienne dans VIEWS[clé], et ses messages y sont traités (withRun) sans toucher l'écran.
const newKey = () => 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let rkey = conv ? conv.id : newKey(), inBg = false, autoAll = !!(conv && conv.autoAll), pendingHand = null;
const VIEWS = {};
function snapshot() {
  return { log, conv, sid, busy, cur, gotResult, denials, pendingAsk, pendingReady, pendingHand, lastCtx, compacting, compactNote, flash, project, granted, rkey, autoAll, turn, quotaStop };
}
function restore(v) {
  ({ log, conv, sid, busy, cur, gotResult, denials, pendingAsk, pendingReady, pendingHand, lastCtx, compacting, compactNote, flash, project, granted, rkey, autoAll, turn, quotaStop } = v);
}
function withRun(key, fn) {                            // exécute fn dans le contexte de la tâche « key » (affichée ou en fond)
  if (key === rkey) return fn();
  const v = VIEWS[key]; if (!v) return;                 // tâche inconnue (page rechargée) : ignorée
  const shown = snapshot(), wasBg = inBg;
  restore(v); inBg = true;
  try { fn(); } finally { VIEWS[key] = snapshot(); restore(shown); inBg = wasBg; }
  renderMenu();
}
function showLog(el) {                                 // met ce fil à l'écran à la place du précédent
  if (el === log) return;
  log.removeAttribute('id'); log.replaceWith(el); el.id = 'log'; log = el;
}
function park() {                                      // la conversation affichée part en fond (si elle travaille encore)
  if (live) { const d = live; liveEnd(); if (d.parentNode) d.remove(); }   // l'aperçu en direct sera remplacé par le message complet
  if (busy || compacting) VIEWS[rkey] = snapshot();
  const fresh = document.createElement('div'); fresh.className = log.className; showLog(fresh);
}
function viewOf(c) { return Object.values(VIEWS).find(v => v.conv === c || v.rkey === c.id); }
auto.checked = store.get('auto', '0') === '1';
log.innerHTML = conv ? conv.hist || '' : '';
tidyAll();                                                             // anciennes conversations : traces de travail retirées aussi

// Le stockage local est limité (~5 Mo) : on garde au plus 40 conversations, on raccourcit les vieilles,
// et si c'est plein on retire les plus anciennes au lieu de perdre l'enregistrement sans rien dire.
function persist() {
  convs.sort((a, b) => b.updated - a.updated);
  if (FILES) {                                                       // fichiers : seulement les conversations modifiées, ajoutées ou supprimées
    if (convs.length > 500) convs.length = 500;
    const ids = new Set();
    convs.forEach(c => { ids.add(c.id); if (convChanged(c)) { sent.set(c.id, snapOf(c)); post('convsave\n' + c.id + '\n' + JSON.stringify(c)); } });
    [...sent.keys()].forEach(id => { if (!ids.has(id)) { sent.delete(id); post('convdel\n' + id); } });
    return;
  }
  if (convs.length > 40) convs.length = 40;
  convs.forEach((c, i) => { if (i >= 10 && c.hist && c.hist.length > 120000) c.hist = c.hist.slice(-120000); });
  for (let tries = 0; tries < 40; tries++) {
    try { localStorage.setItem('convs', JSON.stringify(convs)); return; }
    catch (e) { if (convs.length <= 1) return; convs.pop(); }
  }
}
function save() {
  if (flash || !log.children.length) return;                       // flash : rien n'est enregistré
  if (!conv) {                                                       // 1er message : la conversation naît dans le projet et le sous-groupe choisis
    conv = { id: 'c' + Date.now().toString(36), title: '', sid: sid, project: project, updated: Date.now(), hist: '' };
    if (DRAFT.group && groupsOf(project).includes(DRAFT.group)) conv.group = DRAFT.group;
    DRAFT.group = ''; saveDraft(); convs.unshift(conv); renderDraft();
  }
  conv.sid = sid; conv.hist = log.innerHTML; conv.updated = Date.now(); conv.project = project; conv.granted = [...granted]; conv.autoAll = autoAll;
  if (!conv.title) { const u = log.querySelector('.msg.user'); conv.title = u ? shortTitle(u.textContent) : 'Conversation'; }
  persist();
  if (inBg) return;                                                   // tâche en fond : l'écran reste sur la conversation affichée
  store.set('cur', conv.id); renderMenu(); setSub();
}

function diffHtml(name, i, label) {
  const rows = [];
  const add = (s, cls, p) => String(s == null ? '' : s).split('\n').forEach(l => rows.push('<div class="' + cls + '">' + p + ' ' + esc(l) + '</div>'));
  if (name === 'Edit') { add(i.old_string, 'del', '-'); add(i.new_string, 'ins', '+'); }
  else if (name === 'MultiEdit') (i.edits || []).forEach(e => { add(e.old_string, 'del', '-'); add(e.new_string, 'ins', '+'); });
  else if (name === 'Write') add(i.content, 'ins', '+');
  else return '';
  const more = rows.length > 200 ? '<div class="more">… ' + (rows.length - 200) + ' lignes de plus</div>' : '';
  return '<details class="diff"><summary>' + (label ? '<i></i><span>' + esc(label) + '</span><em>voir</em>' : 'Voir les changements') + '</summary><pre>' + rows.slice(0, 200).join('') + more + '</pre></details>';
}

function askApproval(list) {
  const names = [...new Set(list.map(d => grantName(d.tool_name)))].filter(n => /^[A-Za-z][A-Za-z0-9_-]*$/.test(n));
  const items = list.map(d => {
    const i = d.tool_input || {};
    const what = String(i.command || i.file_path || i.url || i.path || '').slice(0, 300);
    return '<li><b>' + esc(toolName(d.tool_name)) + '</b>' + (what ? ' <code>' + esc(what) + '</code>' : '') + '</li>';
  }).join('');
  const card = el('approve', '<div class="ah">🔐 Claude a besoin de ton accord</div><ul>' + items + '</ul>'
    + '<div class="ab"><button class="no">Refuser</button><button class="all" title="Plus aucune demande d\'accord dans cette conversation">Tout autoriser ici</button><button class="yes">Autoriser</button></div>');
  card.querySelector('.all').onclick = () => {
    card.innerHTML = '<div class="ah">🔓 Tout est autorisé dans cette conversation</div>';
    autoAll = true; if (conv) conv.autoAll = true;
    submit("Je t'autorise. Continue ce que tu faisais (tu as mon accord pour toutes les actions jusqu'à la fin de cette conversation).", '', true);
  };
  card.querySelector('.yes').onclick = () => {
    card.innerHTML = '<div class="ah">✅ Autorisé</div>';
    names.forEach(n => granted.add(n)); if (conv) conv.granted = [...granted];   // valable pour toute la conversation
    submit("Je t'autorise. Continue ce que tu faisais (tu as mon accord pour ces actions jusqu'à la fin de cette conversation).", '', true);
  };
  card.querySelector('.no').onclick = () => { card.innerHTML = '<div class="ah">⛔ Refusé</div>'; save(); };
  scroll();
}

// ---- questions de Claude quand il manque une info capitale : 1 question, 1 à 3 choix, « Autre » si besoin ----
function takeQuestion(t) {
  let ask = null;
  const text = t.replace(/```bebene-question\s*([\s\S]*?)```/g, (m, j) => {
    try {
      const o = JSON.parse(j.trim());
      if (o && o.q) ask = { q: String(o.q), choix: (Array.isArray(o.choix) ? o.choix : []).map(String).filter(x => x.trim()).slice(0, 3), autre: !!o.autre };
    } catch { }
    return '';
  });
  if (ask && !ask.choix.length) ask.autre = true;                       // info libre : seulement le champ
  let ready = null;
  const text2 = text.replace(/```bebene-pret\s*([\s\S]*?)```/g, (m, j) => {
    try { const o = JSON.parse(j.trim()); ready = { quoi: String((o && o.quoi) || 'le fichier') }; } catch { ready = { quoi: 'le fichier' }; }
    return '';
  });
  let hand = null;                                                      // besoin de la souris / du clavier, ou de voir un écran
  const text3 = text2.replace(/```bebene-main\s*([\s\S]*?)```/g, (m, j) => {
    try { const o = JSON.parse(j.trim()); hand = { quoi: String((o && o.quoi) || ''), type: /cran/i.test(String(o && o.type)) ? 'ecran' : 'souris' }; } catch { hand = { quoi: '', type: 'souris' }; }
    return '';
  });
  const rappels = [];                                                   // rappels programmés (Bébène les montre à l'heure dite, côté C#)
  const text4 = text3.replace(/```bebene-rappel\s*([\s\S]*?)```/g, (m, j) => {
    try { const o = JSON.parse(j.trim()); if (o && o.quand && o.quoi) rappels.push({ quand: String(o.quand).trim(), quoi: String(o.quoi).trim().slice(0, 200) }); } catch { }
    return '';
  });
  return { text: text4, ask, ready, hand, rappels };
}
// carte « ⏰ Rappel prévu » (même identifiant que côté C# : quand|quoi), avec Annuler
function showRappel(r) {

}

// ---- étapes d'une tâche longue (outil TodoWrite de Claude) : une carte cochée qui se met à jour, et « 3/5 » sur le chat ----
function showPlan(todos) {
  if (turn && todos.length) turn.todos = todos.map(t => ({ content: String(t.content || ''), status: String(t.status || '') }));
  if (!cur || !todos.length) return;
  const done = todos.filter(t => t.status === 'completed').length;
  const html = '<div class="ph"><span>Étapes</span><b>' + done + '/' + todos.length + '</b></div>' + todos.map(t =>
    '<div class="pi ' + esc(t.status || '') + '"><span class="pc">' + (t.status === 'completed' ? '✓' : t.status === 'in_progress' ? '›' : '') + '</span>'
    + esc(String(t.status === 'in_progress' && t.activeForm ? t.activeForm : t.content || '')) + '</div>').join('');
  let p = cur.querySelector('.plan');
  if (p) p.innerHTML = html; else p = addToCur('plan', html);
  post('progress\n' + rkey + '\n' + done + '\n' + todos.length);
}
// ---- besoin de toi : Bébène a besoin de ta souris / ton clavier, ou de voir une fenêtre qu'il ne peut pas capturer ----
function showHand(h) {
  const card = el('ask hand', '');
  card.dataset.h = JSON.stringify(h);
  card.innerHTML = '<div class="ah"><span>🐾</span><span>' + (h.type === 'ecran' ? 'J\'ai besoin de voir un écran' : 'J\'ai besoin de ta souris et de ton clavier')

    + (h.type === 'ecran' ? '<button class="go">👀 C\'est affiché, regarde</button>' : '<button class="go">🖱 Vas-y, prends la main</button>')

function bindHand(card) {
  let h; try { h = JSON.parse(card.dataset.h); } catch { return; }
  const done = t => { card.querySelector('.ab').outerHTML = '<div class="done">' + t + '</div>'; };
  card.querySelector('.go').onclick = () => {
    if (busy || compacting) return;
    done(h.type === 'ecran' ? '→ Écran affiché' : '→ Souris et clavier prêtés');
    submit(h.type === 'ecran' ? 'C\'est fait : ce que tu voulais voir est affiché à l\'écran maintenant. Regarde et continue.'
      : 'C\'est bon : tu peux utiliser ma souris et mon clavier maintenant, je n\'y touche plus jusqu\'à ce que tu aies fini. Continue.');
  };
  card.querySelector('.adj').onclick = () => { done('→ Plus tard'); post('calm\n' + rkey); save(); };
}
function showAsk(a) {
  const card = el('ask', '');
  card.dataset.q = JSON.stringify(a);
  card.innerHTML = '<div class="ah"><span>?</span><span>' + esc(a.q) + '</span></div><div class="ab"><div class="ch">'
    + a.choix.map((c, i) => '<button data-i="' + i + '">' + esc(c) + '</button>').join('')
    + (a.autre ? (a.choix.length ? '<button class="o">Autre…</button>' : '') + '<div class="ot' + (a.choix.length ? '' : ' on') + '"><input placeholder="Ta réponse…"><button>Envoyer</button></div>' : '')
    + '</div></div>';
  bindAsk(card); scroll();
  if (!a.choix.length) setTimeout(() => card.querySelector('.ot input').focus(), 50);
}
function bindAsk(card) {
  let a; try { a = JSON.parse(card.dataset.q); } catch { return; }
  const answer = v => {
    v = String(v || '').trim(); if (!v || busy || compacting) return;
    card.querySelector('.ab').outerHTML = '<div class="done">→ ' + esc(v) + '</div>';
    submit(v);
  };
  card.querySelectorAll('.ch > button[data-i]').forEach(b => b.onclick = () => answer(a.choix[+b.dataset.i]));
  const o = card.querySelector('button.o'), ot = card.querySelector('.ot');
  if (o) o.onclick = () => { ot.classList.add('on'); o.style.display = 'none'; ot.querySelector('input').focus(); scroll(); };
  if (ot) {
    const inp = ot.querySelector('input');
    ot.querySelector('.ot > button').onclick = () => answer(inp.value);
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); answer(inp.value); } };
  }
}

function bindReady(card) {
  const done = t => { card.querySelector('.ab').outerHTML = '<div class="done">' + t + '</div>'; };
  card.querySelector('.go').onclick = () => { if (busy || compacting) return; done('→ Production lancée'); submit('Le plan est bon : produis le fichier maintenant.'); };
  card.querySelector('.adj').onclick = () => { done('→ Plan à ajuster'); input.placeholder = 'Ce que tu veux changer dans le plan…'; input.focus(); };
