function reviveAsks() {
  log.querySelectorAll('.ask').forEach(c => {
    if (!c.querySelector('.ab')) return;
    if (c === log.lastElementChild) { if (c.classList.contains('ready')) bindReady(c); else if (c.classList.contains('hand')) bindHand(c); else bindAsk(c); }
    else c.querySelector('.ab').outerHTML = '<div class="done">Question passée.</div>';
  });
}
// la conversation en cours rejoint le projet annoncé (et le projet apparaît dans le menu #)
function attachProject(n) {
  if (flash || !n || project === n) return;
  project = n;
  if (!projects.includes(n)) { projects.push(n); projects.sort(); post('ensureproject\n' + n); }
  if (conv) conv.project = n;
  if (cur) addToCur('tool keep', '<i></i><span>📁 Conversation rattachée au projet · ' + esc(n) + '</span>');
  applyMode();
}
// déplacer une conversation de l'historique vers un projet (ou « aucun projet »)
function moveConv(id, p) {
  const c = convs.find(x => x.id === id); if (!c) return;
  c.project = p; persist();
  if (conv && conv.id === id && !busy) { project = p; applyMode(); }
  renderMenu();
}
function askMove(el, id) {
  const c = convs.find(x => x.id === id); if (!c) return;
  const gs = groupsOf(c.project || ''), inG = !!(c.group && gs.includes(c.group));

// ---- compactage automatique : quand la conversation a grossi de ~40 000 tokens depuis son début (ou le dernier compactage),

}

    else compactNote.remove();

function submit(text, allowed, silent, noDraft) {

// Quota restant, d'après les infos officielles renvoyées par Claude Code (rate_limit_event)
let lastQuota = null, lastAsk = 0;
function left(t) {
  const sec = t - Date.now() / 1000; if (sec <= 0) return null;
  const m = Math.ceil(sec / 60);
  return m < 60 ? m + ' min' : m < 1440 ? Math.floor(m / 60) + 'h' + String(m % 60).padStart(2, '0') : Math.round(m / 1440) + ' j';
}
setInterval(() => { if (lastQuota) setQuota(lastQuota); }, 30000);   // le compte à rebours avance tout seul
function setQuota(info) {
  lastQuota = info;

  const when = t => new Date(t * 1000).toLocaleString('fr-CH', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  let any = false;
  [['five_hour', 'q5', 'qs', 'Session (5 h)'], ['seven_day', 'q7', 'qw', 'Semaine']].forEach(([k, id, box, label]) => {
    const x = w[k]; if (!x || typeof x.utilization !== 'number') { $('#' + box).style.display = 'none'; return; }
    any = true; $('#' + box).style.display = '';
    const l = x.resetsAt ? left(x.resetsAt) : '', past = !!x.resetsAt && l === null;
    if (past && Date.now() - lastAsk > 120000) { lastAsk = Date.now(); post('quotaprobe'); }   // fenêtre écoulée : on redemande
    const rem = past ? 1 : Math.max(0, Math.min(1, 1 - x.utilization));
    const b = $('#' + id); b.style.width = (rem * 100).toFixed(1) + '%';
    b.style.background = rem > .5 ? '#7bc67e' : rem > .2 ? '#e0b84f' : '#e8504a';
    $('#' + id + 't').textContent = Math.round(rem * 100) + ' %';
    $('#' + id + 'r').textContent = l ? '↻ ' + l : '';
    $('#' + box).title = label + ' : ' + Math.round(rem * 100) + ' % restant' + (past ? ' · rechargé' : l ? ' · recharge complète dans ' + l + ' (' + when(x.resetsAt) + ')' : '');
  });

}

// ---- écriture en direct (--include-partial-messages) : les morceaux de texte arrivent pendant que Claude rédige ----
// On les révèle mot par mot, à une vitesse qui s'adapte : douce quand Claude écrit lentement, et qui rattrape vite

const liveCut = t => {
  const i = t.indexOf('```bebene-'); if (i >= 0) return t.slice(0, i);
  const m = t.match(/(?:^|\n)(`{1,3}[a-z-]{0,10})$/);

function liveRender() {

  live.innerHTML = md(liveCut(liveText).slice(0, liveShown));
  const ps = live.querySelectorAll('p,li,h1,h2,h3,h4,h5'), tgt = ps.length ? ps[ps.length - 1] : live;
  if (!tgt.closest('pre')) tgt.insertAdjacentHTML('beforeend', '<span class="lc"></span>');

}

}

  if (!live) liveStart(); if (!live) return;
  liveText += s; if (!liveRaf) liveRaf = requestAnimationFrame(liveTick);
}

function liveEnd(text) {

  d.className = 'md'; d.innerHTML = md(text); d.dataset.raw = text; return d;
}

function onLine(l) {
  let o; try { o = JSON.parse(l); } catch { return; }
  if (o.session_id && o.session_id !== sid) setSid(o.session_id);
  if (o.type === "rate_limit_event" && o.rate_limit_info) { store.set("quota", JSON.stringify(o.rate_limit_info)); setQuota(o.rate_limit_info); checkQuota(o.rate_limit_info); }
  if (o.type === 'assistant' && o.message && o.message.usage) { const u = o.message.usage; lastCtx = (u.input_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0); }
  if (o.type === 'system' && o.subtype === 'init' && /haiku/i.test(o.model || '') && cur && !cur.querySelector('.lite'))
    addToCur('tool lite', '<i></i><span>⚡ Réponse rapide (Haiku)</span>');   // question simple : modèle léger, moins de quota

    const ev = o.event || {};

        else if (q.text.trim()) addToCur('md', md(q.text)).dataset.raw = q.text;
        if (q.ask) pendingAsk = q.ask;
        if (q.ready) pendingReady = q.ready;
        if (q.hand) pendingHand = q.hand;
        q.rappels.forEach(showRappel);
      }
      if (c.type === 'tool_use' && c.name === 'TodoWrite' && !o.parent_tool_use_id) { showPlan((c.input || {}).todos || []); continue; }

        hideSearch();

// Réponse arrivée : on ne garde que la réponse. Lignes d'outils, de recherche et la réponse rapide disparaissent ;
// les étapes et les fichiers modifiés sont regroupés dans une seule ligne dépliable, sous la réponse.
function tidyTurn(m) {
  if (!m || !m.querySelector(':scope > .md:not(.live)')) return;
  m.querySelectorAll(':scope > .srch, :scope > .tool:not(.keep), :scope > .typing').forEach(x => x.remove());
  const ds = [...m.children].filter(x => x.matches('details.diff') || (!x.className && x.querySelector(':scope > details.diff'))), pl = m.querySelector(':scope > .plan');
  if (!ds.length && !pl) return;
  const files = new Set(ds.map(d => (d.querySelector('summary span') || d).textContent.replace(/^[^·]*·\s*/, '')));
  const parts = [];
  if (files.size) parts.push('✏️ ' + files.size + ' fichier' + (files.size > 1 ? 's' : '') + ' modifié' + (files.size > 1 ? 's' : ''));
  if (pl) parts.push('☑ étapes');
  const box = document.createElement('details'); box.className = 'acts';
  box.innerHTML = '<summary>' + esc(parts.join(' · ')) + '<em>voir</em></summary>';

function finish(code, err) {

  const lastTxt = cur ? textOf(cur) : '';
  if (cur) {
    const t = cur.querySelector('.typing'); if (t) t.remove();
    cur.querySelectorAll('.srch').forEach(x => x.remove());            // recherche finie : sa trace disparaît
    if (code === '0' && !quotaStop) tidyTurn(cur);                       // réponse arrivée : la réponse seule (détails repliés)
    if (code !== '0' && !gotResult && !quotaStop)

    if (!cur.children.length) cur.remove();

  let kind = 'done';
  if (quotaStop) { showPause(quotaStop, lastTxt); kind = 'pause'; quotaStop = null; denials = []; }
  else if (denials.length) { askApproval(denials); kind = 'perm'; }
  else if (pendingHand && code === '0') { showHand(pendingHand); kind = 'hand'; }
  else if (pendingAsk && code === '0') { showAsk(pendingAsk); kind = 'ask'; }
  else if (pendingReady && code === '0') showReady(pendingReady);
  pendingAsk = null; pendingReady = null; pendingHand = null;
  denials = []; decorate(); scroll(); save(); askTitle(code); maybeCompact(code);
  if (conv && inBg) { conv.attn = kind; persist(); }                  // pastille dans l'historique jusqu'à ce qu'on la rouvre (après save : la conversation existe)
  if (code !== '-1') post('notify\n' + kind + '\n' + (inBg ? 0 : 1) + '\n' + rkey + '\n' + (flash ? 'Flash' : conv && conv.title ? conv.title : 'Nouvelle conversation'));
}

// Titre résumé par Claude : après les 3 premiers échanges, puis tous les 3 (la conversation évolue)

  const n = log.querySelectorAll('.msg.user').length;

function ago(t) {

// Le menu n'est pas redessiné pendant un clic (bouton enfoncé) ni pendant une saisie dedans : un élément remplacé entre

const SHORT = p => { p = String(p || '').replace(/\\/g, '/').replace(/\/+$/, ''); const a = p.split('/'); return a.length > 3 ? '…/' + a.slice(-2).join('/') : p; };

function searchOf(n, i) {
  if (n === 'Read') return { ic: '📄', t: 'Je lis ' + SHORT(i.file_path) };
  if (n === 'Glob') return { ic: '📁', t: 'Je cherche ' + (i.pattern || 'des fichiers') + (i.path ? ' dans ' + SHORT(i.path) : '') };
  if (n === 'Grep') return { ic: '🔎', t: 'Je cherche « ' + String(i.pattern || '').slice(0, 40) + ' »' + (i.path ? ' dans ' + SHORT(i.path) : '') };
  if (n === 'LS') return { ic: '📁', t: 'Je regarde ' + SHORT(i.path) };
  if (n === 'WebSearch') return { ic: '🌐', t: 'Je cherche sur le web : ' + String(i.query || '').slice(0, 70) };
  if (n === 'WebFetch') return { ic: '🌐', t: 'Je lis ' + HOST(i.url) };
  if ((n === 'Task' || n === 'Agent') && /explore/i.test(i.subagent_type || '')) return { ic: '🔎', t: 'J\'explore : ' + String(i.description || '').slice(0, 70) };
  const ch = n.match(/^mcp__claude-in-chrome__(\w+)/);
  if (ch) {
    if (/navigate/.test(ch[1]) && i.url) return { ic: '🌐', t: 'Je consulte ' + HOST(i.url) };
    if (/read_page|get_page_text|find|tabs_context/.test(ch[1])) return { ic: '🌐', t: 'Je lis la page dans Chrome' };
    return null;
  }
  const mc = n.match(/^mcp__(.+?)__(\w+)$/);
  if (mc && /^(search|list|get|read|query|fetch|find)/i.test(mc[2])) {
    const svc = mc[1].replace(/^claude_ai_/, '').replace(/_/g, ' ');
    return { ic: /mail|outlook/i.test(svc) ? '✉️' : /calendar|agenda/i.test(svc) ? '📅' : '🪟', t: 'Je consulte ' + svc };
  }

    const cmd = String(i.command || '').trim();
    if (/ecran\.ps1/i.test(cmd)) return { ic: '🪟', t: 'Je regarde la fenêtre' };
    const c0 = cmd.replace(/^(?:powershell|pwsh)(?:\.exe)?\s+(?:-\w+\s+)*["']?/i, '').replace(/^cd\s+(?:"[^"]*"|'[^']*'|\S+)\s*(?:&&|;)\s*/i, '');

    const place = cmdPlace(c0), w = m[1].toLowerCase();

    return { ic, t: (ic === '📄' ? 'Je lis ' : 'Je cherche dans ') + (place ? SHORT(place) : i.description ? String(i.description).slice(0, 60) : 'tes fichiers') };
  }

}

// ---- Brouillon de la prochaine conversation : ce que le raccourci a capturé (texte, fichiers, dossiers) + le texte tapé.
// Gardé (localStorage) tant que le 1er message n'est pas envoyé : fermer la discussion ou relancer Bébène ne perd rien.
// Chaque nouveau raccourci AJOUTE sa sélection. Avant d'envoyer, on choisit le projet (palette) et le sous-groupe (liste ici).
const SEL_ACTS = {
  expl: ['💡 Expliquer', 'Explique-moi simplement ce texte :'],
  trad: ['🌐 Traduire', 'Traduis ce texte (en français s\'il est dans une autre langue, sinon en anglais) :'],
  corr: ['✏️ Corriger', 'Corrige l\'orthographe et la grammaire de ce texte, et donne la version corrigée prête à copier :'],
  resu: ['📝 Résumer', 'Résume ce texte en quelques points :']
};
function saveDraft() { store.set('draft', JSON.stringify(DRAFT)); }
const baseName = p => String(p).replace(/[\/]+$/, '').split(/[\/]/).pop() || p;
function draftContext(items) {
  const ps = items.filter(x => x.t === 'path'), ts = items.filter(x => x.t === 'text');
  let s = '';
  if (ps.length) s += '\n\nDossiers et fichiers sélectionnés :\n' + ps.map(x => '- ' + x.p + (x.d ? ' (dossier)' : '')).join('\n');
  ts.forEach(x => { s += '\n\nTexte sélectionné :\n"""\n' + x.v + '\n"""'; });
  return s;
}
function isNewChat() { return !flash && !conv && !log.querySelector('.msg'); }
function renderDraft() {
  const b = $('#selbar'), it = DRAFT.items, gs = isNewChat() ? groupsOf(project) : [];
  if (DRAFT.group && !gs.includes(DRAFT.group)) DRAFT.group = '';
  if (!it.length && !gs.length) { b.classList.remove('on'); setHTML(b, ''); placeholder(); return; }
  const chip = (x, i) => x.t === 'path'
    ? '<span class="dchip" title="' + esc(x.p) + '"><span class="dl">' + (x.d ? '📁' : '📄') + ' ' + esc(baseName(x.p)) + '</span><button data-rm="' + i + '" title="Retirer">×</button></span>'
    : '<span class="dchip" title="' + esc(x.v.slice(0, 600)) + '"><span class="dl">📋 « ' + esc(x.v.replace(/\s+/g, ' ').slice(0, 38)) + (x.v.length > 38 ? '…' : '') + ' » · ' + x.v.length + ' car.</span><button data-rm="' + i + '" title="Retirer">×</button></span>';
  let h = '';
  if (gs.length) h += '<div class="ddest">Nouvelle conversation dans <b># ' + esc(project) + '</b> › <select id="dGroup" title="Sous-groupe de la nouvelle conversation"><option value="">Sans groupe</option>'
    + gs.map(g => '<option' + (g === DRAFT.group ? ' selected' : '') + ' value="' + esc(g) + '">📂 ' + esc(g) + '</option>').join('') + '</select></div>';
  if (it.length) {
    h += '<div class="dchips">' + it.map(chip).join('') + (it.length > 1 ? '<button class="dclr" title="Tout retirer">Tout retirer</button>' : '') + '</div>';
    if (it.some(x => x.t === 'text')) h += '<div class="sb">' + Object.keys(SEL_ACTS).map(k => '<button data-a="' + k + '">' + SEL_ACTS[k][0] + '</button>').join('') + '</div>';
  }
  setHTML(b, h); b.classList.add('on'); placeholder();
}
function placeholder() {
  const it = DRAFT.items;
  input.placeholder = flash ? 'Question rapide… (non enregistrée)'
    : it.some(x => x.t === 'path') ? 'Que veux-tu faire avec ' + (it.filter(x => x.t === 'path').length > 1 ? 'ces éléments' : 'cet élément') + ' ?'
    : it.length ? 'Ou pose ta question sur ce texte…' : 'Écris à ' + ($('#name').textContent || 'Bébène') + '…';
}
// message « selection » du raccourci : {text, files:[{p, d}]} (ancien format : texte brut)
function showSel(v) {
  let s; try { s = JSON.parse(v); } catch { s = { text: v || '' }; }
  if (typeof s !== 'object' || !s) s = { text: String(v || '') };
  const text = String(s.text || '').trim(), files = Array.isArray(s.files) ? s.files : [];
  if ((text || files.length) && !isNewChat() && !flash) newChat({ project: project });   // une conversation déjà commencée : la sélection part dans une nouvelle
  if (text && !DRAFT.items.some(x => x.t === 'text' && x.v === text)) DRAFT.items.push({ t: 'text', v: text.slice(0, 20000) });
  files.forEach(f => { if (f && f.p && !DRAFT.items.some(x => x.t === 'path' && x.p === f.p)) DRAFT.items.push({ t: 'path', p: f.p, d: !!f.d }); });
  saveDraft(); renderDraft(); input.focus();
}
function takeDraft() { const it = DRAFT.items; DRAFT.items = []; saveDraft(); renderDraft(); return it; }
$('#selbar').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { DRAFT.items.splice(+rm.dataset.rm, 1); saveDraft(); renderDraft(); input.focus(); return; }
  if (e.target.closest('.dclr')) { takeDraft(); input.focus(); return; }
  const a = e.target.closest('[data-a]'); if (!a || !DRAFT.items.length) return;
  if (busy || compacting) newChat({ project: project });                 // la conversation affichée travaille : une nouvelle pour cette demande
  const t = SEL_ACTS[a.dataset.a][1] + draftContext(takeDraft());
  submit(t, undefined, false, true);
});
$('#selbar').addEventListener('change', e => { if (e.target.id === 'dGroup') { DRAFT.group = e.target.value; saveDraft(); } });
// texte tapé : gardé lui aussi (fermeture de la discussion, page libérée, redémarrage)
{ let t = 0; input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => store.set('draftText', input.value), 250); }); }
if (!input.value && store.get('draftText', '')) { input.value = store.get('draftText', ''); setTimeout(autosize, 0); }
renderDraft();

// ---- point du jour (une fois par jour, réglage « Point du jour ») ----
function showBrief(v) {
  let b; try { b = JSON.parse(v); } catch { return; }
  const li = (h, t, extra) => '<div class="bi"><b>' + esc(h) + '</b><span>' + esc(t) + (extra || '') + '</span></div>';
  const tag = e => (e.k === 'exam' ? ' <i class="bt ex">examen</i>' : e.k === 'rdv' ? ' <i class="bt rv">rdv</i>' : '') + (e.m ? ' <i class="bt ml" title="Trouvé dans un mail">✉</i>' : '');
  const pins = (NOTES && NOTES.notes || []).filter(n => n.pinned && n.shown !== false);
  const paused = convs.filter(c => c.attn === 'pause');
  let h = '<div class="bh"><span>☀️ Point du jour · ' + esc(b.date || '') + '</span><button class="x" title="Fermer">×</button></div>';
  h += '<div class="bs">Aujourd\'hui</div>' + (b.today.length ? b.today.map(e => li(e.h, e.t, (e.l ? ' · ' + esc(e.l) : '') + tag(e))).join('') : '<div class="bn">Rien dans ton agenda.</div>');
  if (b.rappels.length) h += '<div class="bs">Rappels</div>' + b.rappels.map(r => li(r.h, '⏰ ' + r.t)).join('');
  if (b.soon.length) h += '<div class="bs">Examens et rendez-vous de la semaine</div>' + b.soon.map(e => li(e.h, e.t, tag(e))).join('');
  if (pins.length) h += '<div class="bs">Post-it épinglés</div>' + pins.map(n => '<div class="bi"><b>📌</b><span>' + esc(n.title || '') + '</span></div>').join('');
  if (paused.length) h += '<div class="bs">Tâches en pause</div>' + paused.map(c => '<button class="bi bc" data-c="' + c.id + '"><b>⏸</b><span>' + esc(c.title || 'Conversation') + '</span></button>').join('');
  h += '<div class="bf"><a href="#" class="boff">Ne plus afficher (réglages › Alertes)</a></div>';
  const el2 = $('#brief'); el2.innerHTML = h; el2.classList.add('on');
}
$('#brief').addEventListener('click', e => {
  if (e.target.closest('.x')) { $('#brief').classList.remove('on'); return; }
  if (e.target.closest('.boff')) { e.preventDefault(); $('#brief').classList.remove('on'); post('settings'); return; }
  const c = e.target.closest('[data-c]'); if (c) { const cv = convs.find(x => x.id === c.dataset.c); $('#brief').classList.remove('on'); if (cv) openConv(cv); }
});

window.chrome.webview.addEventListener('message', e => {
  const d = String(e.data), i = d.indexOf('\n');
  const k = i < 0 ? d : d.slice(0, i), v = i < 0 ? '' : d.slice(i + 1);
  // messages d'une tâche : rline / rdone / compacted portent la clé de leur conversation (affichée ou en fond)
  const kv = s => { const j = s.indexOf('\n'); return j < 0 ? [s, ''] : [s.slice(0, j), s.slice(j + 1)]; };
  if (k === 'rline') { const [key, l] = kv(v); withRun(key, () => onLine(l)); }
  else if (k === 'rdone') { const [key, r] = kv(v), [code, err] = kv(r); withRun(key, () => finish(code, err)); }
  else if (k === 'compacted') { const [key, r] = kv(v), p = r.split('\n'); withRun(key, () => compacted(p[0] === '1', +p[1], +p[2])); }
  else if (k === 'openconv') {                                       // clic sur une notification Windows
    const vw = VIEWS[v], c = vw ? vw.conv : convs.find(x => x.id === v);
    if (v !== rkey && c) openConv(c);
  }
  else if (k === 'notes') { try { NOTES = JSON.parse(v); renderNotes(); } catch { } }
  else if (k === 'dir') { $('#dir').textContent = v; $('#dir').title = v + ' — cliquer pour changer'; }
  else if (k === 'new') newChat();
  else if (k === 'focus') input.focus();
  else if (k === 'pinned') { $('#pin').classList.toggle('on', v === '1'); }
  else if (k === 'quota') { try { const q = JSON.parse(v); store.set('quota', v); setQuota(q); [rkey].concat(Object.keys(VIEWS)).forEach(key => withRun(key, () => checkQuota(q))); } catch {} }
  else if (k === 'saved') toast('⬇ Enregistré dans Téléchargements : <b>' + esc(v.split(/[\\/]/).pop()) + '</b> · <u>Afficher</u>', () => post('reveal\n' + v));
  else if (k === 'saveerr') toast('Impossible d\'enregistrer le fichier : ' + esc(v), null, true);
  else if (k === 'name') { $('#name').textContent = v; document.title = v; applyMode(); }
  else if (k === 'theme') { document.documentElement.classList.toggle('light', v === 'light'); store.set('theme', v); }
  else if (k === 'projects') { try { const o = JSON.parse(v); projects = Array.isArray(o) ? o : o.all || []; ARCH = new Set(o.arch || []); } catch { projects = []; } renderMenu(); }
  else if (k === 'project') { newChat({ project: v }); }
  else if (k === 'upd') { try { UPD = JSON.parse(v); } catch { UPD = null; } renderUpd(); }
  else if (k === 'updstatus') { const j = v.indexOf('\n'), st = j < 0 ? v : v.slice(0, j), msg = j < 0 ? '' : v.slice(j + 1);
    updErr = st === 'err'; updStatus = st === 'err' ? 'Échec : ' + msg : st === 'restart' ? 'Installation… Bébène redémarre dans un instant.' : msg;
    if (UPD) { $('#updpop').classList.add('open'); fillPop(); } }
  else if (k === 'title') { const j = v.indexOf('\n'), c = convs.find(x => x.id === v.slice(0, j)); if (c && !c.titleLock) { c.title = v.slice(j + 1).trim(); persist(); renderMenu(); setSub(); } }
  else if (k === 'paths') v.split('\n').filter(Boolean).forEach(addPath);
  else if (k === 'pasted') { addPath(v); toast('🖼 Image collée : Claude la verra avec ton message.'); }
  else if (k === 'selection') showSel(v);
  else if (k === 'brief') showBrief(v);
});

document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drop'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drop'); });
document.addEventListener('drop', e => {
  e.preventDefault(); document.body.classList.remove('drop');
  if (e.dataTransfer.files.length) window.chrome.webview.postMessageWithAdditionalObjects('files', e.dataTransfer.files);
});

input.addEventListener('input', autosize);
// Listes : « 1. » ou « * » / « - » + espace en début de ligne ; Entrée continue la liste, Entrée sur un élément vide la termine.
// Ctrl+Entrée envoie toujours, Maj+Entrée = simple retour à la ligne.
input.addEventListener('input', e => {
  if (e.inputType !== 'insertText' || e.data !== ' ') return;
  const pos = input.selectionStart, v = input.value, ls = v.lastIndexOf('\n', pos - 1) + 1, before = v.slice(ls, pos);
  if (/^\s*[*-] $/.test(before)) { input.setRangeText(before.replace(/[*-] $/, '• '), ls, pos, 'end'); }
});
input.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  if (e.ctrlKey) { e.preventDefault(); submit(); return; }
  const pos = input.selectionStart, v = input.value, ls = v.lastIndexOf('\n', pos - 1) + 1;
  const m = v.slice(ls, pos).match(/^(\s*)(•|(\d+)([.)]))\s+(.*)$/);
  if (m && pos === input.selectionEnd) {
    e.preventDefault();
    if (!m[5].trim()) { input.setRangeText('', ls, pos, 'end'); autosize(); return; }     // élément vide : fin de la liste
    input.setRangeText('\n' + m[1] + (m[3] ? (+m[3] + 1) + m[4] : '•') + ' ', pos, pos, 'end'); autosize(); return;
  }
  if (!e.shiftKey) { e.preventDefault(); submit(); }
});
// Indication visible quand on est dans une liste (sinon « 1. » + espace ne montre rien)
function listHint() {
  const pos = input.selectionStart, v = input.value, ls = v.lastIndexOf('\n', pos - 1) + 1, le = v.indexOf('\n', pos);
  const m = v.slice(ls, le < 0 ? v.length : le).match(/^\s*(•|(\d+)[.)])\s/);
  const h = $('#lhint'); h.classList.toggle('on', !!m);
  if (m) h.innerHTML = '<b>' + (m[2] ? 'Liste numérotée' : 'Liste à puces') + '</b> · <kbd>Entrée</kbd> élément suivant · <kbd>Entrée</kbd> sur un élément vide : fin · <kbd>Ctrl</kbd>+<kbd>Entrée</kbd> envoyer';
}
input.addEventListener('keyup', listHint); input.addEventListener('click', listHint);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (anyPop()) closePops(); else post('hide'); } });
send.onclick = () => busy ? post('stop\n' + rkey) : submit();
$('#new').onclick = () => newChat({ project: project });
$('#term').onclick = () => post('terminal');
$('#cfg').onclick = () => post('settings');
$('#coffee').onclick = () => window.open('https://buymeacoffee.com/p0770');                 // ouvert dans le navigateur (lien externe)
function setSid(v) { sid = v; if (!inBg) post('sid\n' + v); save(); }
$('#close').onclick = () => post('hide');
$('#pin').onclick = () => { const on = !$('#pin').classList.contains('on'); $('#pin').classList.toggle('on', on); $('#pin').title = on ? 'Épinglée : reste ouverte (cliquer pour libérer)' : 'Épingler : garder ouverte quand je clique ailleurs'; post('pin\n' + (on ? 1 : 0)); };
$('#dir').onclick = () => post('folder');
auto.onchange = () => store.set('auto', auto.checked ? '1' : '0');
document.querySelectorAll('.chip').forEach(b => b.onclick = () => submit(b.dataset.q));
document.addEventListener('click', e => { const a = e.target.closest('a'); if (a) { e.preventDefault(); window.open(a.href); } });

post('ready');
post('sid\n' + sid);
applyMode(); post('projects');
try { setQuota(JSON.parse(store.get("quota", ""))); } catch {}
</script>
</body>
