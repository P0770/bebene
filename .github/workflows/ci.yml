# Intégration continue : à chaque push sur main et à chaque pull request,
# GitHub compile Bébène sur une machine Windows et lance les tests (sans Claude réel, donc sans compte ni tokens).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Compilation et tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # WebView2 (NuGet) gardé entre deux exécutions
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\BebeneBuild
          key: webview2-1.0.2903.40

      - name: Compiler
        shell: powershell
        run: .\build.ps1 -NoStart

      - name: Tests
        shell: powershell
        run: .\tests\tests.ps1

      - name: Mesure du rendu du chat
        shell: powershell
        run: |
          $p = Start-Process "$HOME\ClaudeCompanion\ClaudeCompanion.exe" -ArgumentList '--bench', "$env:TEMP\BebeneTests\bench.txt" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill() }
          Get-Content "$env:TEMP\BebeneTests\bench.txt" -ErrorAction SilentlyContinue

      - name: Images et pages des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: ~\AppData\Local\Temp\BebeneTests
          if-no-files-found: ignore
